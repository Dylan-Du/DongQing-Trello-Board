function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function getCssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function renderStatsView() {
  const allCards = [];
  state.lists.forEach(list => {
    (list.cards || []).forEach(card => {
      allCards.push({ ...card, listTitle: list.title });
    });
  });

  const now = new Date();
  const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
  const totalCards = allCards.length;
  const weeklyCompleted = allCards.filter(c => c.completedAt && new Date(c.completedAt) >= weekAgo).length;
  const overdue = allCards.filter(c => c.dueDate && new Date(c.dueDate) < now).length;
  const totalLabels = allCards.reduce((sum, c) => sum + (c.labels || []).length, 0);

  document.getElementById('stat-total').textContent = totalCards;
  document.getElementById('stat-weekly').textContent = weeklyCompleted;
  document.getElementById('stat-overdue').textContent = overdue;
  document.getElementById('stat-labels').textContent = totalLabels;

  drawLabelPieChart(allCards);
  drawListHealthChart();
  drawCompletionTrend(allCards);
  drawListCompareChart();
}

function drawLabelPieChart(allCards) {
  const canvas = document.getElementById('chart-labels');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = 300, h = 300;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const labelCounts = {};
  allCards.forEach(card => {
    (card.labels || []).forEach(label => {
      const key = label.color || 'blue';
      labelCounts[key] = (labelCounts[key] || 0) + 1;
    });
  });

  const entries = Object.entries(labelCounts);
  const total = entries.reduce((s, [, c]) => s + c, 0);
  const cx = w / 2, cy = h / 2;
  const outerR = Math.min(w, h) / 2 - 24;
  const innerR = outerR * 0.52;

  if (total === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
    ctx.strokeStyle = getCssVar('--border-overlay');
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('暂无标签数据', cx, cy);
    return;
  }

  let startAngle = -Math.PI / 2;
  entries.forEach(([color, count]) => {
    const c = LABEL_COLORS[color] || LABEL_COLORS.blue;
    const sliceAngle = (count / total) * Math.PI * 2;

    // Draw slice
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, startAngle, startAngle + sliceAngle);
    ctx.arc(cx, cy, innerR, startAngle + sliceAngle, startAngle, true);
    ctx.closePath();
    ctx.fillStyle = c.bg;
    ctx.fill();
    ctx.strokeStyle = getCssVar('--card-bg');
    ctx.lineWidth = 2;
    ctx.stroke();

    // Draw label
    const midAngle = startAngle + sliceAngle / 2;
    const labelR = outerR + 22;
    const lx = cx + Math.cos(midAngle) * labelR;
    const ly = cy + Math.sin(midAngle) * labelR;
    const pct = Math.round((count / total) * 100);
    ctx.fillStyle = getCssVar('--text');
    ctx.font = 'bold 11px -apple-system, sans-serif';
    ctx.textAlign = (midAngle > Math.PI * 0.5 || midAngle < -Math.PI * 0.5) ? 'right' : 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.name + ' ' + pct + '%', lx, ly);

    startAngle += sliceAngle;
  });

  // Center text
  ctx.fillStyle = getCssVar('--text');
  ctx.font = 'bold 14px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(total + ' 个', cx, cy);
}

function drawListHealthChart() {
  const canvas = document.getElementById('chart-lists');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = 400, h = 300;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const lists = state.lists;
  if (lists.length === 0) {
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无列表数据', w / 2, h / 2);
    return;
  }

  const pad = { top: 24, right: 24, bottom: 44, left: 24 };
  const chartW = w - pad.left - pad.right;
  const chartH = h - pad.top - pad.bottom;
  const maxCards = Math.max(...lists.map(l => l.cards.length), 1);
  const barW = Math.min(48, (chartW / lists.length) * 0.6);
  const gap = (chartW - barW * lists.length) / (lists.length + 1);
  const yScale = chartH / maxCards;

  // Axes
  ctx.strokeStyle = getCssVar('--border-overlay');
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top);
  ctx.lineTo(pad.left, h - pad.bottom);
  ctx.lineTo(w - pad.right, h - pad.bottom);
  ctx.stroke();

  // Y gridlines
  ctx.strokeStyle = getCssVar('--border-overlay');
  ctx.globalAlpha = 0.25;
  for (let i = 1; i <= maxCards; i++) {
    const y = h - pad.bottom - i * yScale;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(i, pad.left - 6, y + 4);
  }
  ctx.globalAlpha = 1;

  lists.forEach((list, i) => {
    const x = pad.left + gap + i * (barW + gap);
    const barH = list.cards.length * yScale;
    const y = h - pad.bottom - barH;

    const grad = ctx.createLinearGradient(x, y, x, h - pad.bottom);
    grad.addColorStop(0, '#3b82f6');
    grad.addColorStop(1, '#60a5fa');
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, barW, barH, 5);
    ctx.fill();

    // Count
    ctx.fillStyle = getCssVar('--text');
    ctx.font = 'bold 11px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(list.cards.length, x + barW / 2, y - 10);

    // Label
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    const label = list.title.length > 5 ? list.title.slice(0, 5) + '..' : list.title;
    ctx.fillText(label, x + barW / 2, h - pad.bottom + 18);
  });
}

function drawCompletionTrend(allCards) {
  const canvas = document.getElementById('chart-trend');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = 700, h = 250;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const pad = { top: 16, right: 20, bottom: 36, left: 44 };
  const chartW = w - pad.left - pad.right;
  const chartH = h - pad.top - pad.bottom;

  const now = new Date();
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    days.push(d);
  }

  const dailyCounts = days.map(day => {
    const dayStart = new Date(day.getFullYear(), day.getMonth(), day.getDate());
    const dayEnd = new Date(dayStart.getTime() + 86400000);
    return allCards.filter(c => {
      if (!c.completedAt) return false;
      const compDate = new Date(c.completedAt);
      return compDate >= dayStart && compDate < dayEnd;
    }).length;
  });

  const maxCount = Math.max(...dailyCounts, 1);
  const xStep = chartW / (days.length - 1);
  const yScale = chartH / maxCount;

  // Axes
  ctx.strokeStyle = getCssVar('--border-overlay');
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top);
  ctx.lineTo(pad.left, h - pad.bottom);
  ctx.lineTo(w - pad.right, h - pad.bottom);
  ctx.stroke();

  // Y gridlines
  ctx.strokeStyle = getCssVar('--border-overlay');
  ctx.globalAlpha = 0.25;
  for (let i = 0; i <= maxCount; i++) {
    const y = h - pad.bottom - i * yScale;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(i, pad.left - 8, y + 4);
  }
  ctx.globalAlpha = 1;

  // Area fill
  ctx.beginPath();
  ctx.moveTo(pad.left, h - pad.bottom);
  dailyCounts.forEach((count, i) => {
    ctx.lineTo(pad.left + i * xStep, h - pad.bottom - count * yScale);
  });
  ctx.lineTo(pad.left + (days.length - 1) * xStep, h - pad.bottom);
  ctx.closePath();
  const areaGrad = ctx.createLinearGradient(0, pad.top, 0, h - pad.bottom);
  areaGrad.addColorStop(0, 'rgba(59, 130, 246, 0.25)');
  areaGrad.addColorStop(1, 'rgba(59, 130, 246, 0.02)');
  ctx.fillStyle = areaGrad;
  ctx.fill();

  // Line
  ctx.beginPath();
  dailyCounts.forEach((count, i) => {
    const x = pad.left + i * xStep;
    const y = h - pad.bottom - count * yScale;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Dots
  dailyCounts.forEach((count, i) => {
    if (count > 0) {
      const x = pad.left + i * xStep;
      const y = h - pad.bottom - count * yScale;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#3b82f6';
      ctx.fill();
      ctx.strokeStyle = getCssVar('--card-bg');
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  });

  // X labels
  for (let i = 0; i < days.length; i += 5) {
    const x = pad.left + i * xStep;
    const d = days[i];
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText((d.getMonth() + 1) + '/' + d.getDate(), x, h - pad.bottom + 16);
  }
}

function drawListCompareChart() {
  const canvas = document.getElementById('chart-list-compare');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = 700, h = 250;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const lists = state.lists;
  const pad = { top: 10, right: 60, bottom: 10, left: 120 };
  const chartW = w - pad.left - pad.right;
  const chartH = h - pad.top - pad.bottom;
  const barH = Math.min(32, (chartH / lists.length) - 10);
  const gap = 10;
  const totalH = lists.length * (barH + gap) - gap;
  const startY = pad.top + (chartH - totalH) / 2;

  if (lists.length === 0) {
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无列表数据', w / 2, h / 2);
    return;
  }

  const maxCards = Math.max(...lists.map(l => l.cards.length), 1);
  const xScale = chartW / maxCards;

  lists.forEach((list, i) => {
    const y = startY + i * (barH + gap);
    const bw = Math.max(list.cards.length * xScale, list.cards.length > 0 ? 4 : 0);

    // Label
    ctx.fillStyle = getCssVar('--text');
    ctx.font = '12px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(list.title, pad.left - 12, y + barH / 2);

    // Bar
    if (list.cards.length > 0) {
      const grad = ctx.createLinearGradient(pad.left, 0, pad.left + chartW, 0);
      grad.addColorStop(0, '#3b82f6');
      grad.addColorStop(1, '#60a5fa');
      ctx.fillStyle = grad;
      roundRect(ctx, pad.left, y, bw, barH, 5);
      ctx.fill();
    }

    // Count
    ctx.fillStyle = getCssVar('--text');
    ctx.font = 'bold 12px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(list.cards.length, pad.left + bw + 10, y + barH / 2);
  });
}

/* ============================================================
   Calendar View
   ============================================================ */
let calYear, calMonth, calWeekStart, calViewMode = 'month';

function getAllCardsWithDueDate() {
  const result = [];
  state.lists.forEach(list => {
    (list.cards || []).forEach(card => {
      if (card.dueDate) {
        result.push({ ...card, listTitle: list.title, listId: list.id });
      }
    });
  });
  return result;
}

function getCardsByDate(year, month, day) {
  const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  return getAllCardsWithDueDate().filter(card => {
    if (!card.dueDate) return false;
    return card.dueDate === dateStr;
  });
}

function renderCalendarView() {
  const titleEl = document.getElementById('cal-month-title');
  const gridEl = document.getElementById('cal-grid');

  if (calViewMode === 'month') {
    const now = new Date();
    if (calYear === undefined) calYear = now.getFullYear();
    if (calMonth === undefined) calMonth = now.getMonth();
    titleEl.textContent = `${calYear}年 ${calMonth + 1}月`;
    renderMonthView(gridEl);
  } else {
    const now = new Date();
    if (calWeekStart === undefined) {
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const dayOfWeek = today.getDay();
      calWeekStart = new Date(today.getTime() - dayOfWeek * 86400000);
    }
    const weekEnd = new Date(calWeekStart.getTime() + 6 * 86400000);
    const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    titleEl.textContent = `${calWeekStart.getFullYear()}年 ${monthNames[calWeekStart.getMonth()]} ${calWeekStart.getDate()}日 - ${monthNames[weekEnd.getMonth()]} ${weekEnd.getDate()}日`;
    renderWeekView(gridEl);
  }
}

function renderMonthView(gridEl) {
  const allCards = getAllCardsWithDueDate();
  const firstDay = new Date(calYear, calMonth, 1);
  const startDayOfWeek = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  let html = '';
  const totalCells = 42;

  for (let i = 0; i < totalCells; i++) {
    let day, month, year, isOtherMonth = false;

    if (i < startDayOfWeek) {
      day = daysInPrevMonth - startDayOfWeek + i + 1;
      month = calMonth - 1;
      year = calYear;
      if (month < 0) { month = 11; year = calYear - 1; }
      isOtherMonth = true;
    } else if (i - startDayOfWeek >= daysInMonth) {
      day = i - startDayOfWeek - daysInMonth + 1;
      month = calMonth + 1;
      year = calYear;
      if (month > 11) { month = 0; year = calYear + 1; }
      isOtherMonth = true;
    } else {
      day = i - startDayOfWeek + 1;
      month = calMonth;
      year = calYear;
    }

    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const isToday = year === today.getFullYear() && month === today.getMonth() && day === today.getDate();

    const cardsWithDue = allCards.filter(card => card.dueDate === dateStr);

    html += renderDayCell(day, isOtherMonth, isToday, cardsWithDue, year, month);
  }

  gridEl.innerHTML = html;
  gridEl.className = 'cal-grid';

  attachDayCellEvents();
}

function renderDayCell(day, isOtherMonth, isToday, cardsWithDue, year, month) {
  let cls = 'cal-day';
  if (isOtherMonth) cls += ' other-month';
  if (isToday) cls += ' today';

  const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

  let dotsHtml = '';
  if (cardsWithDue.length > 0) {
    const maxDots = 3;
    dotsHtml = '<div class="cal-day-dots">';
    for (let i = 0; i < Math.min(cardsWithDue.length, maxDots); i++) {
      const card = cardsWithDue[i];
      const labelColor = card.labels && card.labels.length > 0
        ? (LABEL_COLORS[card.labels[0].color] || LABEL_COLORS.blue).bg
        : '#3b82f6';
      dotsHtml += `<span class="cal-day-dot" style="background:${labelColor}"></span>`;
    }
    if (cardsWithDue.length > maxDots) {
      dotsHtml += `<span class="cal-day-more">+${cardsWithDue.length - maxDots}</span>`;
    }
    dotsHtml += '</div>';
  }

  return `<div class="${cls}" data-date="${dateStr}" data-has-cards="${cardsWithDue.length > 0 ? '1' : '0'}">
    <div class="cal-day-header">${day}</div>
    ${dotsHtml}
  </div>`;
}

function attachDayCellEvents() {
  document.querySelectorAll('#cal-grid .cal-day[data-has-cards="1"]').forEach(cell => {
    cell.addEventListener('click', (e) => {
      e.stopPropagation();
      const dateStr = cell.dataset.date;
      openDayPopup(dateStr);
    });
  });
}

function openDayPopup(dateStr) {
  const popup = document.getElementById('cal-day-popup');
  const dateEl = document.getElementById('cal-popup-date');
  const cardsEl = document.getElementById('cal-popup-cards');

  const [y, m, d] = dateStr.split('-').map(Number);
  dateEl.textContent = `${y}年${m}月${d}日`;

  const cards = getCardsByDate(y, m - 1, d);
  cardsEl.innerHTML = cards.length === 0
    ? '<div style="color:var(--text-faint);font-size:13px;padding:8px 0">暂无卡片</div>'
    : cards.map(card => {
        const labelColor = card.labels && card.labels.length > 0
          ? (LABEL_COLORS[card.labels[0].color] || LABEL_COLORS.blue).bg
          : '#3b82f6';
        return `<div class="cal-popup-card" data-card-id="${card.id}">
          <div class="cal-popup-card-title">${escapeHtml(card.title)}</div>
          <div class="cal-popup-card-list">${escapeHtml(card.listTitle)}</div>
        </div>`;
      }).join('');

  popup.style.display = 'flex';

  // Attach card click events
  cardsEl.querySelectorAll('.cal-popup-card').forEach(el => {
    el.addEventListener('click', () => {
      const cardId = el.dataset.cardId;
      openCardById(cardId);
      popup.style.display = 'none';
    });
  });

  // Close button
  popup.querySelector('.cal-popup-close').onclick = () => {
    popup.style.display = 'none';
  };

  // Close on click outside
  const closeOnOutside = (e) => {
    if (!popup.contains(e.target) && !e.target.closest('.cal-day')) {
      popup.style.display = 'none';
      document.removeEventListener('click', closeOnOutside);
    }
  };
  setTimeout(() => document.addEventListener('click', closeOnOutside), 0);
}

function openCardById(cardId) {
  switchView('board');
  // Small delay to let board render
  setTimeout(() => {
    const cardEl = document.querySelector(`.card[data-card-id="${cardId}"]`);
    if (cardEl) {
      const list = state.lists.find(l => l.cards.some(c => c.id === cardId));
      const card = list ? list.cards.find(c => c.id === cardId) : null;
      if (card && list) {
        openModal(cardEl, card, list.id);
      }
    }
  }, 200);
}

function renderWeekView(gridEl) {
  const allCards = getAllCardsWithDueDate();
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const weekDayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  let html = '<div class="week-container">';

  for (let i = 0; i < 7; i++) {
    const day = new Date(calWeekStart.getTime() + i * 86400000);
    const dateStr = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;
    const isToday = day.getTime() === today.getTime();
    const cardsOnDay = allCards.filter(card => card.dueDate === dateStr);

    html += `<div class="week-day${isToday ? ' today' : ''}">
      <div class="week-day-header">
        <span class="week-day-date">${day.getMonth() + 1}/${day.getDate()}</span>
        <span class="week-day-label">${weekDayNames[day.getDay()]}</span>
        <span class="week-day-count">${cardsOnDay.length} 张卡片</span>
      </div>`;

    if (cardsOnDay.length === 0) {
      html += '<div style="color:var(--text-faint);font-size:12px;padding:4px 0">暂无到期卡片</div>';
    } else {
      cardsOnDay.forEach(card => {
        const labelColor = card.labels && card.labels.length > 0
          ? (LABEL_COLORS[card.labels[0].color] || LABEL_COLORS.blue).bg
          : '#3b82f6';
        html += `<div class="week-card" data-card-id="${card.id}">
          <span class="week-card-dot" style="background:${labelColor}"></span>
          <div class="week-card-info">
            <div class="week-card-title">${escapeHtml(card.title)}</div>
            <div class="week-card-list">${escapeHtml(card.listTitle)}</div>
          </div>
        </div>`;
      });
    }

    html += '</div>';
  }

  html += '</div>';
  gridEl.innerHTML = html;
  gridEl.className = '';

  // Attach card click events
  gridEl.querySelectorAll('.week-card').forEach(el => {
    el.addEventListener('click', () => {
      const cardId = el.dataset.cardId;
      openCardById(cardId);
    });
  });
}

   AI Summary Engine
   ============================================================ */

function getAllCardsWithContext() {
  const cards = [];
  state.lists.forEach(list => {
    (list.cards || []).forEach(card => {
      cards.push({
        title: card.title,
        description: card.description || '',
        listTitle: list.title,
        labels: (card.labels || []).map(l => {
          const c = LABEL_COLORS[l.color] || {};
          return (l.text || c.name || l.color);
        }).join(', '),
        subtaskTotal: (card.subtasks || []).length,
        subtaskDone: (card.subtasks || []).filter(s => s.done).length,
        dueDate: card.dueDate,
        createdAt: card.createdAt,
        completedAt: card.completedAt,
      });
    });
  });
  return cards;
}

function generateRuleSummary() {
  const cards = getAllCardsWithContext();
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const sevenDaysAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

  // 即将到期 (未来3天内)
  const threeDaysLater = new Date(today.getTime() + 3 * 24 * 60 * 60 * 1000);
  const upcoming = cards.filter(c => {
    if (!c.dueDate || c.completedAt) return false;
    const due = new Date(c.dueDate);
    return due >= today && due <= threeDaysLater;
  });

  // 已过期
  const overdue = cards.filter(c => {
    if (!c.dueDate || c.completedAt) return false;
    const due = new Date(c.dueDate);
    return due < today;
  });

  // 长期停滞 (>7天未完成且未更新)
  const stagnant = cards.filter(c => {
    if (c.completedAt) return false;
    const created = new Date(c.createdAt);
    return created < sevenDaysAgo;
  });

  const totalCards = cards.length;
  const completedCards = cards.filter(c => c.completedAt).length;
  const activeCards = cards.filter(c => !c.completedAt).length;

  let html = '';

  // 总览
  html += `<h4>看板总览</h4>`;
  html += `<p>总计 <strong>${totalCards}</strong> 张卡片，已完成 <strong class="ai-success">${completedCards}</strong> 张，进行中 <strong>${activeCards}</strong> 张。</p>`;

  if (overdue.length > 0) {
    html += `<h4><span class="ai-danger">已过期 (${overdue.length})</span></h4><ul>`;
    overdue.forEach(c => {
      html += `<li>${escapeHtml(c.title)} <span class="ai-danger">[${c.listTitle}]</span></li>`;
    });
    html += '</ul>';
  }

  if (upcoming.length > 0) {
    html += `<h4><span class="ai-warning">即将到期 (${upcoming.length})</span></h4><ul>`;
    upcoming.forEach(c => {
      html += `<li>${escapeHtml(c.title)} <span class="ai-warning">[${formatDate(c.dueDate)}]</span></li>`;
    });
    html += '</ul>';
  }

  if (stagnant.length > 0) {
    html += `<h4>长期停滞 >7天 (${stagnant.length})</h4><ul>`;
    stagnant.forEach(c => {
      html += `<li>${escapeHtml(c.title)} <span style="color:var(--text-faint)">[${c.listTitle}]</span></li>`;
    });
    html += '</ul>';
  }

  if (overdue.length === 0 && upcoming.length === 0) {
    html += `<p class="ai-success">所有事项正常，没有过期或即将到期的卡片。</p>`;
  }

  return html;
}

function generateWeeklyReport() {
  const cards = getAllCardsWithContext();
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

  // 本周完成
  const weeklyCompleted = cards.filter(c => {
    if (!c.completedAt) return false;
    const compDate = new Date(c.completedAt);
    return compDate >= weekAgo;
  });

  // 本周新增
  const weeklyNew = cards.filter(c => {
    if (!c.createdAt) return false;
    const created = new Date(c.createdAt);
    return created >= weekAgo;
  });

  // 进行中
  const inProgress = cards.filter(c => !c.completedAt);

  const weekStart = new Date(weekAgo);
  const weekStartStr = (weekStart.getMonth() + 1) + '月' + weekStart.getDate() + '日';
  const todayStr = (today.getMonth() + 1) + '月' + today.getDate() + '日';

  let md = '';
  md += `# 周报 (${weekStartStr} - ${todayStr})\n\n`;

  md += `## 概览\n`;
  md += `- 本周完成：${weeklyCompleted.length} 张\n`;
  md += `- 本周新增：${weeklyNew.length} 张\n`;
  md += `- 进行中：${inProgress.length} 张\n\n`;

  if (weeklyCompleted.length > 0) {
    md += `## 本周完成\n`;
    weeklyCompleted.forEach(c => {
      md += `- [${c.listTitle}] ${c.title}\n`;
    });
    md += '\n';
  }

  if (weeklyNew.length > 0) {
    md += `## 本周新增\n`;
    weeklyNew.forEach(c => {
      md += `- [${c.listTitle}] ${c.title}\n`;
    });
    md += '\n';
  }

  if (inProgress.length > 0) {
    md += `## 进行中\n`;
    inProgress.forEach(c => {
      const dueSuffix = c.dueDate ? ` (${formatDate(c.dueDate)}到期)` : '';
      md += `- [${c.listTitle}] ${c.title}${dueSuffix}\n`;
    });
    md += '\n';
  }

  return md;
}

function generateRulePrompt() {
  const cards = getAllCardsWithContext();
  const now = new Date();
  const todayStr = now.toISOString().split('T')[0];

  let prompt = `当前日期：${todayStr}\n\n`;
  prompt += '以下是看板中所有卡片的数据：\n\n';

  state.lists.forEach(list => {
    prompt += `## 列表：${list.title}\n`;
    if (list.cards.length === 0) {
      prompt += '(空)\n\n';
    } else {
      list.cards.forEach(card => {
        prompt += `- 标题：${card.title}\n`;
        if (card.description) prompt += `  描述：${card.description}\n`;
        if (card.labels && card.labels.length) {
          const labelTexts = card.labels.map(l => l.text || (LABEL_COLORS[l.color] ? LABEL_COLORS[l.color].name : l.color)).join(', ');
          prompt += `  标签：${labelTexts}\n`;
        }
        if (card.dueDate) prompt += `  到期日：${card.dueDate}\n`;
        const subtaskDone = (card.subtasks || []).filter(s => s.done).length;
        const subtaskTotal = (card.subtasks || []).length;
        if (subtaskTotal > 0) prompt += `  子任务：${subtaskDone}/${subtaskTotal}\n`;
        if (card.completedAt) prompt += `  完成时间：${card.completedAt}\n`;
        prompt += '\n';
      });
    }
  });

  return prompt;
}

/* ============================================================
   AI API Call
   ============================================================ */

async function callAI(prompt) {
  const config = getAIConfig();
  if (!config.apiKey) return null;

  try {
    const response = await fetch(config.endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${config.apiKey}`,
      },
      body: JSON.stringify({
        model: config.model,
        messages: [
          { role: 'system', content: '你是一个项目管理助手，帮助用户分析看板数据并提供简洁的摘要和建议。请用中文回复。' },
          { role: 'user', content: prompt },
        ],
        temperature: 0.7,
        max_tokens: 2000,
      }),
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API 请求失败 (${response.status}): ${errText}`);
    }

    const data = await response.json();
    return data.choices && data.choices[0] && data.choices[0].message
      ? data.choices[0].message.content
      : null;
  } catch (e) {
    console.error('AI API 调用失败:', e);
    return null;
  }
}

  aiSummaryEl.innerHTML = '<pre>' + escapeHtml(weeklyMd) + '</pre>';
  aiWeeklyBtn.disabled = false;
  aiWeeklyBtn.textContent = '\u{1f4cb} 生成周报';
});
</script>
