/* ============================================================
   Card Drag System
   ============================================================ */
let cardDrag = null;
let isDragging = false;

function attachCardEvents(el, card, listId) {
  el.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('.card-label')) return;
    // Don't start drag if clicking on interactive elements
    const startX = e.clientX, startY = e.clientY;
    let started = false;
    const threshold = 5;

    function onMove(ev) {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      if (!started && (Math.abs(dx) > threshold || Math.abs(dy) > threshold)) {
        started = true;
        beginCardDrag(ev, el, card, listId);
      }
      if (started) {
        ev.preventDefault();
        updateCardDrag(ev);
      }
    }
    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if (started) {
        endCardDrag(ev);
      }
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });

  el.addEventListener('click', (e) => {
    if (isDragging) { e.stopPropagation(); e.preventDefault(); return; }
    openModal(el, card, listId);
  });

  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (isDragging) return;
    showCardContextMenu(e.clientX, e.clientY, card, listId);
  });
}

function showCardContextMenu(x, y, card, listId) {
  const board = getActiveBoard();
  const otherLists = board.lists.filter(l => l.id !== listId);
  const items = [
    { label: '打开卡片', icon: '↗', action: () => openCardById(card.id) },
    { label: '复制卡片', icon: '📄', action: () => {
      snapshotForUndo();
      const copy = {
        ...card,
        id: uid('card'),
        title: card.title + '（副本）',
        labels: (card.labels || []).map(l => ({ ...l })),
        subtasks: (card.subtasks || []).map(s => ({ ...s, id: uid('sub') })),
        attachments: (card.attachments || []).map(a => ({ ...a, id: uid('att') })),
        createdAt: new Date().toISOString(),
        completedAt: null,
      };
      const list = board.lists.find(l => l.id === listId);
      if (!list) return;
      const idx = list.cards.findIndex(c => c.id === card.id);
      list.cards.splice(idx + 1, 0, copy);
      saveState();
      renderBoard();
      updateBoardSwitcherUI();
      showToast('卡片已复制', null, '撤销', () => { undoPop(); });
    }},
  ];
  if (otherLists.length) {
    items.push({ label: '移动到列表 ▸', icon: '➜', action: () => {
      const sub = otherLists.map(l => ({
        label: l.title + ` (${l.cards.length})`,
        icon: '·',
        action: () => {
          snapshotForUndo();
          const from = board.lists.find(l => l.id === listId);
          if (!from) return;
          const idx = from.cards.findIndex(c => c.id === card.id);
          if (idx === -1) return;
          from.cards.splice(idx, 1);
          if (completedKeywords.test(l.title || '')) card.completedAt = new Date().toISOString();
          l.cards.push(card);
          saveState();
          renderBoard();
          updateBoardSwitcherUI();
          showToast(`已移动到「${l.title}」`, null, '撤销', () => { undoPop(); });
        },
      }));
      showContextMenu(x, y, sub);
    }});
  }
  items.push({ label: '归档卡片', icon: '📦', action: () => {
    const list = board.lists.find(l => l.id === listId);
    archiveCard(card, list);
    updateBoardSwitcherUI();
  }});
  items.push({ label: '删除卡片', icon: '🗑', danger: true, action: () => {
    snapshotForUndo();
    const list = board.lists.find(l => l.id === listId);
    if (!list) return;
    const idx = list.cards.findIndex(c => c.id === card.id);
    if (idx !== -1) list.cards.splice(idx, 1);
    state.archive.unshift({ type: 'card', card, listTitle: list.title, listId: list.id, boardId: board.id, archivedAt: new Date().toISOString() });
    saveState();
    renderBoard();
    updateBoardSwitcherUI();
    showToast('卡片已删除（可在归档站找回）', null, '撤销', () => { undoPop(); });
  }});
  showContextMenu(x, y, items);
}

function beginCardDrag(e, cardEl, card, listId) {
  isDragging = true;
  const rect = cardEl.getBoundingClientRect();
  const ghost = cardEl.cloneNode(true);
  ghost.classList.add('card-ghost');
  ghost.classList.remove('dragging');
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);

  cardEl.classList.add('dragging');

  cardDrag = {
    cardEl, card, ghost, listId,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
    lastTargetList: null,
    lastTargetIndex: -1,
    autoScrollRAF: null,
    scrollDX: 0,
    scrollDY: 0,
    scrollContainerH: null,
    scrollContainerV: null,
  };
  document.body.classList.add('no-select');
}

function updateCardDrag(e) {
  if (!cardDrag) return;
  const { ghost, offsetX, offsetY } = cardDrag;
  // Move ghost
  ghost.style.left = (e.clientX - offsetX) + 'px';
  ghost.style.top = (e.clientY - offsetY) + 'px';

  // Find drop target
  ghost.style.pointerEvents = 'none';
  const elements = document.elementsFromPoint(e.clientX, e.clientY);
  ghost.style.pointerEvents = '';

  const listCardsEl = elements.find(el => el.classList && el.classList.contains('list-cards'));
  const listEl = elements.find(el => el.classList && el.classList.contains('list'));

  let targetListEl = null;
  let targetListCardsEl = null;

  if (listCardsEl) {
    targetListCardsEl = listCardsEl;
    targetListEl = listCardsEl.closest('.list');
  } else if (listEl) {
    targetListEl = listEl;
    targetListCardsEl = listEl.querySelector('.list-cards');
  }

  if (!targetListEl || !targetListCardsEl) {
    // Check if over the board area but between lists
    const board = document.getElementById('board');
    const boardRect = board.getBoundingClientRect();
    if (e.clientY > boardRect.top && e.clientY < boardRect.bottom) {
      // Find closest list by X position
      const lists = Array.from(document.querySelectorAll('.list:not(.dragging)'));
      let closest = null, minDist = Infinity;
      lists.forEach(l => {
        const r = l.getBoundingClientRect();
        const center = r.left + r.width / 2;
        const dist = Math.abs(e.clientX - center);
        if (dist < minDist) { minDist = dist; closest = l; }
      });
      if (closest) {
        targetListEl = closest;
        targetListCardsEl = closest.querySelector('.list-cards');
      }
    }
  }

  if (!targetListEl) {
    handleAutoScroll(e);
    return;
  }

  const targetListId = targetListEl.dataset.listId;
  const cards = Array.from(targetListCardsEl.querySelectorAll('.card:not(.dragging)'));
  let insertIndex = cards.length;
  for (let i = 0; i < cards.length; i++) {
    const r = cards[i].getBoundingClientRect();
    const midY = r.top + r.height / 2;
    if (e.clientY < midY) { insertIndex = i; break; }
  }

  // Check if position actually changed by comparing DOM neighbors
  const cardParent = cardDrag.cardEl.parentElement;
  const cardNextSibling = cardDrag.cardEl.nextElementSibling;
  const targetNextSibling = insertIndex < cards.length ? cards[insertIndex] : null;
  const wouldBeSameSpot = (cardParent === targetListCardsEl && cardNextSibling === targetNextSibling);

  if (!wouldBeSameSpot) {
    // FLIP
    const allCards = getAllCardsForFlip();
    const flip = flipElements(allCards);

    // Move card element in DOM
    if (insertIndex >= cards.length) {
      targetListCardsEl.appendChild(cardDrag.cardEl);
    } else {
      targetListCardsEl.insertBefore(cardDrag.cardEl, cards[insertIndex]);
    }

    flip.play();
    cardDrag.lastTargetList = targetListId;
    cardDrag.lastTargetIndex = insertIndex;
  }

  handleAutoScroll(e, targetListCardsEl, targetListEl);
}

function handleAutoScroll(e, listCardsEl, listEl) {
  const edge = 80;
  const board = document.getElementById('board');
  const boardRect = board.getBoundingClientRect();

  // Horizontal scroll on board
  let dx = 0;
  if (e.clientX < boardRect.left + edge) {
    dx = -Math.max(4, (edge - (e.clientX - boardRect.left)) / 3);
  } else if (e.clientX > boardRect.right - edge) {
    dx = Math.max(4, (edge - (boardRect.right - e.clientX)) / 3);
  }

  // Vertical scroll on list cards
  let dy = 0;
  if (listCardsEl) {
    const r = listCardsEl.getBoundingClientRect();
    if (e.clientY < r.top + edge) {
      dy = -Math.max(4, (edge - (e.clientY - r.top)) / 3);
    } else if (e.clientY > r.bottom - edge) {
      dy = Math.max(4, (edge - (r.bottom - e.clientY)) / 3);
    }
  }

  cardDrag.scrollDX = dx;
  cardDrag.scrollDY = dy;
  cardDrag.scrollContainerH = board;
  cardDrag.scrollContainerV = listCardsEl;

  if (dx !== 0 || dy !== 0) {
    if (!cardDrag.autoScrollRAF) {
      const scrollLoop = () => {
        if (!cardDrag) return;
        if (cardDrag.scrollDX !== 0 && cardDrag.scrollContainerH) {
          cardDrag.scrollContainerH.scrollLeft += cardDrag.scrollDX;
        }
        if (cardDrag.scrollDY !== 0 && cardDrag.scrollContainerV) {
          cardDrag.scrollContainerV.scrollTop += cardDrag.scrollDY;
        }
        cardDrag.autoScrollRAF = animFrame(scrollLoop);
      };
      cardDrag.autoScrollRAF = animFrame(scrollLoop);
    }
  } else {
    if (cardDrag.autoScrollRAF) {
      cancelAnim(cardDrag.autoScrollRAF);
      cardDrag.autoScrollRAF = null;
    }
  }
}

function endCardDrag(e) {
  if (!cardDrag) return;
  const { cardEl, ghost, listId } = cardDrag;

  // Stop auto scroll
  if (cardDrag.autoScrollRAF) {
    cancelAnim(cardDrag.autoScrollRAF);
    cardDrag.autoScrollRAF = null;
  }

  // Get ghost final position
  const ghostRect = ghost.getBoundingClientRect();

  // Remove ghost
  ghost.remove();

  // Make card visible
  cardEl.classList.remove('dragging');

  // Get card's natural position
  const cardRect = cardEl.getBoundingClientRect();
  const dx = ghostRect.left - cardRect.left;
  const dy = ghostRect.top - cardRect.top;

  // Animate card from ghost position to natural position
  cardEl.style.transition = 'none';
  cardEl.style.transform = `translate(${dx}px, ${dy}px)`;
  cardEl.offsetHeight; // force reflow
  nextFrame(() => {
    cardEl.style.transition = 'transform 0.22s cubic-bezier(0.2,0,0,1)';
    cardEl.style.transform = '';
    const cleanup = () => {
      cardEl.style.transition = '';
      cardEl.style.transform = '';
      cardEl.removeEventListener('transitionend', cleanup);
    };
    cardEl.addEventListener('transitionend', cleanup);
  });

  // Update state
  const newListEl = cardEl.closest('.list');
  const newListId = newListEl.dataset.listId;
  const newList = state.lists.find(l => l.id === newListId);
  const oldList = state.lists.find(l => l.id === listId);
  if (!newList || !oldList) { cardDrag = null; setTimeout(() => isDragging = false, 50); return; }

  // Find card data
  const cardIndex = oldList.cards.findIndex(c => c.id === cardDrag.card.id);
  if (cardIndex === -1) { cardDrag = null; setTimeout(() => isDragging = false, 50); return; }

  const cardData = oldList.cards.splice(cardIndex, 1)[0];

  // Find new index in DOM
  const cardsInNew = Array.from(newListEl.querySelectorAll('.card'));
  const domIndex = cardsInNew.indexOf(cardEl);
  newList.cards.splice(domIndex, 0, cardData);

  // Mark card as completed if moved to a "done" list
  markCardIfCompleted(cardData, newList.title);

  // Update list counts
  document.querySelectorAll('.list').forEach(l => {
    const count = l.querySelectorAll('.card').length;
    const countEl = l.querySelector('.list-count');
    if (countEl) countEl.textContent = count;
  });

  saveState();
  cardDrag = null;
  setTimeout(() => { isDragging = false; }, 50);
}

/* ============================================================
   List Drag System
   ============================================================ */
let listDrag = null;

function attachListEvents(listEl, list, listIndex) {
  const titleEl = listEl.querySelector('.list-title');
  const menuBtn = listEl.querySelector('.list-menu-btn');
  const addCardBtn = listEl.querySelector('.add-card-btn');

  // Title editing
  titleEl.addEventListener('blur', () => {
    const newTitle = titleEl.textContent.trim();
    if (newTitle && newTitle !== list.title) {
      list.title = newTitle;
      saveState();
    } else {
      titleEl.textContent = list.title;
    }
  });
  titleEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
    if (e.key === 'Escape') { titleEl.textContent = list.title; titleEl.blur(); }
  });

  // List drag via title
  titleEl.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (document.activeElement === titleEl) return; // don't drag when editing
    const startX = e.clientX, startY = e.clientY;
    let started = false;
    const threshold = 5;

    function onMove(ev) {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      if (!started && (Math.abs(dx) > threshold || Math.abs(dy) > threshold)) {
        started = true;
        beginListDrag(ev, listEl, list);
      }
      if (started) {
        ev.preventDefault();
        updateListDrag(ev);
      }
    }
    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if (started) {
        endListDrag(ev);
      }
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });

  // Menu
  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    showContextMenu(e.clientX, e.clientY, [
      { label: '复制列表', icon: '📄', action: () => {
        snapshotForUndo();
        const copy = {
          id: uid('list'),
          title: list.title + '（副本）',
          cards: list.cards.map(c => ({
            ...c,
            id: uid('card'),
            labels: (c.labels || []).map(l => ({ ...l })),
            subtasks: (c.subtasks || []).map(s => ({ ...s, id: uid('sub') })),
            attachments: (c.attachments || []).map(a => ({ ...a, id: uid('att') })),
            createdAt: new Date().toISOString(),
          })),
        };
        const idx = state.lists.findIndex(l => l.id === list.id);
        state.lists.splice(idx + 1, 0, copy);
        saveState();
        renderBoard();
        updateBoardSwitcherUI();
        showToast('列表已复制', null, '撤销', () => { undoPop(); });
      }},
      { label: '归档列表', icon: '📦', action: () => {
        snapshotForUndo();
        const idx = state.lists.findIndex(l => l.id === list.id);
        if (idx !== -1) state.lists.splice(idx, 1);
        state.archive.unshift({ type: 'list', list, boardId: getActiveBoard().id, archivedAt: new Date().toISOString() });
        saveState();
        renderBoard();
        updateBoardSwitcherUI();
        showToast(`列表「${list.title}」已归档`, null, '撤销', () => { undoPop(); });
      }},
      { label: '清空卡片', icon: '🗑', action: () => {
        snapshotForUndo();
        list.cards = [];
        saveState();
        renderBoard();
        updateBoardSwitcherUI();
        showToast('已清空卡片', null, '撤销', () => { undoPop(); });
      }},
      { label: '删除列表', icon: '✕', danger: true, action: () => {
        snapshotForUndo();
        const idx = state.lists.findIndex(l => l.id === list.id);
        if (idx !== -1) {
          state.lists.splice(idx, 1);
          saveState();
          renderBoard();
          updateBoardSwitcherUI();
          showToast(`列表「${list.title}」已删除`, null, '撤销', () => { undoPop(); });
        }
      }},
    ]);
  });

  // Add card
  addCardBtn.addEventListener('click', () => {
    const footer = listEl.querySelector('.list-footer');
    const form = document.createElement('div');
    form.className = 'add-card-form';
    form.innerHTML = `
      <textarea placeholder="输入卡片标题，按 Enter 添加..." rows="2"></textarea>
      <div class="add-card-form-actions">
        <button class="btn-confirm">添加</button>
        <button class="btn-cancel">&times;</button>
      </div>
    `;
    footer.innerHTML = '';
    footer.appendChild(form);
    const ta = form.querySelector('textarea');
    ta.focus();

    let confirmed = false;
    const confirm = () => {
      if (confirmed) return; confirmed = true;
      const title = ta.value.trim();
      if (title) {
        list.cards.push({
          id: uid('card'), title, description: '', labels: [], subtasks: [], attachments: [],
          createdAt: new Date().toISOString(), dueDate: null, completedAt: null
        });
        saveState();
        renderBoard();
        updateBoardSwitcherUI();
      } else {
        restoreAddCardBtn(listEl);
      }
    };
    ta.addEventListener('blur', confirm);
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); confirm(); }
      if (e.key === 'Escape') { e.preventDefault(); confirmed = true; restoreAddCardBtn(listEl); }
    });
    form.querySelector('.btn-confirm').addEventListener('mousedown', (e) => { e.preventDefault(); confirm(); });
    form.querySelector('.btn-cancel').addEventListener('mousedown', (e) => { e.preventDefault(); confirmed = true; restoreAddCardBtn(listEl); });
  });
}

function restoreAddCardBtn(listEl) {
  renderBoard();
}

function beginListDrag(e, listEl, list) {
  isDragging = true;
  const rect = listEl.getBoundingClientRect();
  const ghost = listEl.cloneNode(true);
  ghost.classList.add('card-ghost');

  ghost.style.height = rect.height + 'px';
  ghost.style.left = rect.left + 'px';

  ghost.style.borderRadius = '12px';
  ghost.style.overflow = 'hidden';
  document.body.appendChild(ghost);

  listEl.classList.add('dragging');

  listDrag = {
    listEl, list, ghost,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
    lastInsertIndex: -1,
    autoScrollRAF: null,
    scrollDX: 0,
  };

}

function updateListDrag(e) {
  if (!listDrag) return;
  const { ghost, offsetX, offsetY } = listDrag;
  ghost.style.left = (e.clientX - offsetX) + 'px';
  ghost.style.top = (e.clientY - offsetY) + 'px';

  // Find target position
  ghost.style.pointerEvents = 'none';
  const elements = document.elementsFromPoint(e.clientX, e.clientY);
  ghost.style.pointerEvents = '';

  const board = document.getElementById('board');
  const boardRect = board.getBoundingClientRect();

  // If outside board area, just handle scroll
  if (e.clientY < boardRect.top || e.clientY > boardRect.bottom) {
    handleListAutoScroll(e);
    return;
  }

  const lists = Array.from(document.querySelectorAll('.list:not(.dragging)'));
  let insertIndex = lists.length;
  let foundList = false;
  for (let i = 0; i < lists.length; i++) {
    const r = lists[i].getBoundingClientRect();
    const midX = r.left + r.width / 2;
    if (e.clientX < midX) { insertIndex = i; foundList = true; break; }
  }

  if (!foundList) {
    // Check if over add-list-placeholder
    const placeholder = boardEl.querySelector('.add-list-placeholder');
    if (placeholder) {
      const r = placeholder.getBoundingClientRect();
      if (e.clientX > r.left) {
        insertIndex = lists.length;
        foundList = true;
      }
    }
  }

  const currentLists = Array.from(board.children).filter(c => c.classList.contains('list'));
  // Check if position actually changed by comparing DOM neighbors
  const listNextSibling = listDrag.listEl.nextElementSibling;
  const targetNextSibling = insertIndex < lists.length ? lists[insertIndex] : null;
  const wouldBeSame = (listDrag.listEl.parentElement === board && listNextSibling === targetNextSibling
    || (listNextSibling && listNextSibling.classList.contains('add-list-placeholder') && !targetNextSibling));

  if (!wouldBeSame) {
    const allLists = getAllListsForFlip();
    const flip = flipElements(allLists);

    if (insertIndex >= lists.length) {
      // Insert before the add-list-placeholder
      const placeholder = boardEl.querySelector('.add-list-placeholder');
      if (placeholder) {
        board.insertBefore(listDrag.listEl, placeholder);
      } else {
        board.appendChild(listDrag.listEl);
      }
    } else {
      board.insertBefore(listDrag.listEl, lists[insertIndex]);
    }

    flip.play();
    listDrag.lastInsertIndex = insertIndex;
  }

  handleListAutoScroll(e);
}

function handleListAutoScroll(e) {
  const edge = 80;
  const board = document.getElementById('board');
  const boardRect = board.getBoundingClientRect();
  let dx = 0;
  if (e.clientX < boardRect.left + edge) {
    dx = -Math.max(4, (edge - (e.clientX - boardRect.left)) / 3);
  } else if (e.clientX > boardRect.right - edge) {
    dx = Math.max(4, (edge - (boardRect.right - e.clientX)) / 3);
  }
  listDrag.scrollDX = dx;
  if (dx !== 0) {
    if (!listDrag.autoScrollRAF) {
      const loop = () => {
        if (!listDrag) return;
        if (listDrag.scrollDX !== 0) {
          board.scrollLeft += listDrag.scrollDX;
        }
        listDrag.autoScrollRAF = animFrame(loop);
      };
      listDrag.autoScrollRAF = animFrame(loop);
    }
  } else {
    if (listDrag.autoScrollRAF) {
      cancelAnim(listDrag.autoScrollRAF);
      listDrag.autoScrollRAF = null;
    }
  }
}

function endListDrag(e) {
  if (!listDrag) return;
  const { listEl, ghost } = listDrag;

  if (listDrag.autoScrollRAF) {
    cancelAnim(listDrag.autoScrollRAF);
    listDrag.autoScrollRAF = null;
  }

  const ghostRect = ghost.getBoundingClientRect();
  ghost.remove();

  listEl.classList.remove('dragging');
  const listRect = listEl.getBoundingClientRect();
  const dx = ghostRect.left - listRect.left;
  const dy = ghostRect.top - listRect.top;

  listEl.style.transition = 'none';
  listEl.style.transform = `translate(${dx}px, ${dy}px)`;
  listEl.offsetHeight;
  nextFrame(() => {
    listEl.style.transition = 'transform 0.22s cubic-bezier(0.2,0,0,1)';
    listEl.style.transform = '';
    const cleanup = () => {
      listEl.style.transition = '';
      listEl.style.transform = '';
      listEl.removeEventListener('transitionend', cleanup);
    };
    listEl.addEventListener('transitionend', cleanup);
  });

  // Update state order
  const listEls = Array.from(boardEl.children).filter(c => c.classList.contains('list'));
  const newOrder = listEls.map(el => state.lists.find(l => l.id === el.dataset.listId)).filter(Boolean);
  state.lists = newOrder;
  saveState();

  listDrag = null;
  setTimeout(() => { isDragging = false; }, 50);
}

/* ============================================================
   Modal System
   ============================================================ */
const modalOverlay = document.getElementById('modal-overlay');
const modalEl = document.getElementById('modal');
let currentModalCard = null;
let currentModalListId = null;

function openModal(cardEl, card, listId) {
  currentModalCard = card;
  currentModalListId = listId;

  const cardRect = cardEl.getBoundingClientRect();

  // Populate modal content
  modalEl.querySelector('.modal-title').textContent = card.title;
  const list = state.lists.find(l => l.id === listId);
  modalEl.querySelector('.modal-subtitle').textContent = `在列表「${list ? list.title : ''}」中`;
  modalEl.querySelector('.modal-list-badge').textContent = list ? `列表: ${list.title}` : '';
  modalEl.querySelector('.modal-desc').value = card.description || '';
  document.getElementById('modal-due-date').value = card.dueDate || '';

  renderModalLabels(card);
  renderModalSubtasks(card);
  renderModalAttachments(card);

  // Markdown preview state
  const mdBtn = document.getElementById('md-toggle-btn');
  const descTa = document.getElementById('modal-desc');
  const mdPrev = document.getElementById('md-preview');
  if (mdState.enabled && (card.description || '').trim()) {
    mdPrev.innerHTML = renderMarkdown(card.description);
    mdPrev.hidden = false;
    descTa.hidden = true;
    mdBtn.classList.add('active');
  } else {
    mdPrev.hidden = true;
    descTa.hidden = false;
    mdBtn.classList.remove('active');
  }

  // Show overlay
  modalOverlay.style.display = 'flex';
  modalOverlay.style.opacity = '0';

  // Position modal at center with natural size for measuring
  modalEl.style.left = '50%';
  modalEl.style.top = '50%';
  modalEl.style.transition = 'none';
  modalEl.style.transform = 'translate(-50%, -50%)';
  modalEl.style.opacity = '0';

  // Force layout to get modal's natural rect (unscaled)
  const modalRect = modalEl.getBoundingClientRect();

  // Calculate transform to make modal appear at card's position
  const modalCenterX = modalRect.left + modalRect.width / 2;
  const modalCenterY = modalRect.top + modalRect.height / 2;
  const cardCenterX = cardRect.left + cardRect.width / 2;
  const cardCenterY = cardRect.top + cardRect.height / 2;

  const dx = cardCenterX - modalCenterX;
  const dy = cardCenterY - modalCenterY;
  const scaleX = Math.max(0.1, cardRect.width / modalRect.width);
  const scaleY = Math.max(0.1, cardRect.height / modalRect.height);

  // Apply initial transform (at card position)
  modalEl.style.transition = 'none';
  modalEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${scaleX}, ${scaleY})`;
  modalEl.style.opacity = '1';
  modalEl.style.transformOrigin = 'center center';

  // Animate to open state
  nextFrame(() => {
    modalOverlay.style.transition = 'opacity 0.3s ease';
    modalOverlay.style.opacity = '1';
    modalOverlay.classList.add('active');

    modalEl.style.transition = 'transform 0.42s cubic-bezier(0.2, 0, 0, 1), opacity 0.2s ease';
    modalEl.style.transform = 'translate(-50%, -50%) scale(1)';
  });

  attachModalEvents(card, listId);
}

function closeModal() {
  if (!currentModalCard) return;
  const card = currentModalCard;

  // Find the card element in DOM for reverse animation
  const cardEl = document.querySelector(`.card[data-card-id="${card.id}"]`);
  let cardRect = null;
  if (cardEl) {
    cardRect = cardEl.getBoundingClientRect();
  } else {
    // Card may have been deleted
    modalOverlay.style.opacity = '0';
    setTimeout(() => {
      modalOverlay.classList.remove('active');
      modalOverlay.style.display = 'none';
    }, 300);
    currentModalCard = null;
    return;
  }

  const modalRect = modalEl.getBoundingClientRect();
  const modalCenterX = modalRect.left + modalRect.width / 2;
  const modalCenterY = modalRect.top + modalRect.height / 2;
  const cardCenterX = cardRect.left + cardRect.width / 2;
  const cardCenterY = cardRect.top + cardRect.height / 2;

  const dx = cardCenterX - modalCenterX;
  const dy = cardCenterY - modalCenterY;
  const scaleX = Math.max(0.1, cardRect.width / modalRect.width);
  const scaleY = Math.max(0.1, cardRect.height / modalRect.height);

  // Save any pending edits
  saveModalEdits();

  modalEl.style.transition = 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease 0.1s';
  modalEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${scaleX}, ${scaleY})`;
  modalEl.style.opacity = '0';

  modalOverlay.style.transition = 'opacity 0.3s ease 0.1s';
  modalOverlay.style.opacity = '0';

  setTimeout(() => {
    modalOverlay.classList.remove('active');
    modalOverlay.style.display = 'none';
    modalEl.style.transition = '';
    modalEl.style.transform = '';
    modalEl.style.opacity = '';
  }, 400);

  currentModalCard = null;
}

function saveModalEdits() {
  if (!currentModalCard) return;
  const card = currentModalCard;
  const newTitle = modalEl.querySelector('.modal-title').textContent.trim();
  if (newTitle) card.title = newTitle;
  card.description = document.getElementById('modal-desc').value;
  const dueDateInput = document.getElementById('modal-due-date');
  card.dueDate = dueDateInput ? (dueDateInput.value || null) : null;

  // Update card in DOM
  const cardEl = document.querySelector(`.card[data-card-id="${card.id}"]`);
  if (cardEl) {
    const titleEl = cardEl.querySelector('.card-title');
    if (titleEl) titleEl.textContent = card.title;
  }

  saveState();
  // Re-render board to update badges/labels
  renderBoard();
  updateBoardSwitcherUI();
}

function attachModalEvents(card, listId) {
  const closeBtn = modalEl.querySelector('.modal-close');
  const titleEl = modalEl.querySelector('.modal-title');
  const descEl = document.getElementById('modal-desc');
  const deleteBtn = modalEl.querySelector('.modal-delete-btn');
  const subtaskInput = modalEl.querySelector('.subtask-add input');
  const subtaskBtn = modalEl.querySelector('.subtask-add button');
  const mdBtn = document.getElementById('md-toggle-btn');
  const mdPrev = document.getElementById('md-preview');
  const attachAddBtn = document.getElementById('attach-add-btn');

  // Markdown preview toggle
  mdBtn.onclick = () => { toggleMarkdownPreview(card); };
  // Preview shows live content while typing in edit mode
  descEl.oninput = () => {
    if (!mdState.enabled) {
      mdPrev.innerHTML = renderMarkdown(descEl.value);
    }
  };

  // Paste screenshot as attachment while modal is open
  modalPasteHandler = (e) => {
    if (!currentModalCard || currentModalCard.id !== card.id) return;
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (const item of items) {
      if (item.type && item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (!file) continue;
        const reader = new FileReader();
        reader.onload = () => {
          if (addAttachmentFromDataUrl(card, reader.result, file.name || '截图.png')) {
            renderModalAttachments(card);
            showToast('已添加粘贴的截图');
          }
        };
        reader.readAsDataURL(file);
        e.preventDefault();
        break;
      }
    }
  };
  document.addEventListener('paste', modalPasteHandler);

  // Attachment add button
  attachAddBtn.onclick = () => openAttachFilePicker(card);

  // Close on overlay click
  modalOverlay.onclick = (e) => {
    if (e.target === modalOverlay) closeModal();
  };
  closeBtn.onclick = closeModal;

  // Due date clear button
  const dueClearBtn = document.getElementById('modal-due-clear');
  if (dueClearBtn) {
    dueClearBtn.onclick = () => {
      document.getElementById('modal-due-date').value = '';
    };
  }

  // Title editing
  titleEl.onblur = () => {
    const newTitle = titleEl.textContent.trim();
    if (newTitle && newTitle !== card.title) {
      card.title = newTitle;
      saveState();
    } else {
      titleEl.textContent = card.title;
    }
  };
  titleEl.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
  };

  // Description
  descEl.onblur = () => {
    card.description = descEl.value;
    saveState();
  };

  // Delete card
  deleteBtn.onclick = () => {
    const list = state.lists.find(l => l.id === listId);
    if (list) {
      const idx = list.cards.findIndex(c => c.id === card.id);
      if (idx !== -1) {
        snapshotForUndo();
        list.cards.splice(idx, 1);
        state.archive.unshift({ type: 'card', card, listTitle: list.title, listId: list.id, boardId: getActiveBoard().id, archivedAt: new Date().toISOString() });
        saveState();
        currentModalCard = null;
        modalOverlay.classList.remove('active');
        modalOverlay.style.display = 'none';
        renderBoard();
        updateBoardSwitcherUI();
        showToast('卡片已删除（可在归档站找回）', null, '撤销', () => { undoPop(); });
      }
    }
  };

  // Subtask add
  const addSubtask = () => {
    const text = subtaskInput.value.trim();
    if (text) {
      card.subtasks = card.subtasks || [];
      card.subtasks.push({ id: uid('sub'), text, done: false });
      subtaskInput.value = '';
      saveState();
      renderModalSubtasks(card);
    }
  };
  subtaskBtn.onclick = addSubtask;
  subtaskInput.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addSubtask(); }
  };

  // Escape to close
  document.addEventListener('keydown', modalKeydownHandler);
}

function modalKeydownHandler(e) {
  if (e.key === 'Escape' && currentModalCard) {
    closeModal();
    document.removeEventListener('keydown', modalKeydownHandler);
    if (modalPasteHandler) { document.removeEventListener('paste', modalPasteHandler); modalPasteHandler = null; }
  }
}

function renderModalLabels(card) {
  const container = modalEl.querySelector('.modal-labels');
  const picker = modalEl.querySelector('.label-picker');
  card.labels = card.labels || [];

  container.innerHTML = card.labels.map((l, i) => {
    const c = LABEL_COLORS[l.color] || LABEL_COLORS.blue;
    const displayText = l.text || c.name;
    return `<span class="modal-label" style="background:${c.bg};color:${c.text}">
      <span class="modal-label-text" contenteditable="true" spellcheck="false" data-index="${i}">${escapeHtml(displayText)}</span>
      <button class="modal-label-remove" data-index="${i}">&times;</button>
    </span>`;
  }).join('') || '<span style="color:var(--text-faint);font-size:12px">暂无标签</span>';

  // Label text editing
  container.querySelectorAll('.modal-label-text').forEach(textEl => {
    const idx = parseInt(textEl.dataset.index);
    const label = card.labels[idx];
    if (!label) return;
    textEl.addEventListener('blur', () => {
      const newText = textEl.textContent.trim();
      if (newText) {
        label.text = newText;
        saveState();
      } else {
        textEl.textContent = label.text || (LABEL_COLORS[label.color] || LABEL_COLORS.blue).name;
      }
    });
    textEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); textEl.blur(); }
      if (e.key === 'Escape') {
        e.preventDefault();
        textEl.textContent = label.text || (LABEL_COLORS[label.color] || LABEL_COLORS.blue).name;
        textEl.blur();
      }
    });
  });

  // Label remove
  container.querySelectorAll('.modal-label-remove').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.index);
      card.labels.splice(idx, 1);
      saveState();
      renderModalLabels(card);
    };
  });

  // Color picker
  picker.innerHTML = Object.entries(LABEL_COLORS).map(([key, c]) => {
    const active = card.labels.some(l => l.color === key);
    return `<button class="label-color-btn ${active ? 'active' : ''}" data-color="${key}" style="background:${c.bg}" title="${c.name}"></button>`;
  }).join('');

  picker.querySelectorAll('.label-color-btn').forEach(btn => {
    btn.onclick = () => {
      const color = btn.dataset.color;
      const existing = card.labels.findIndex(l => l.color === color);
      if (existing !== -1) {
        card.labels.splice(existing, 1);
      } else {
        const c = LABEL_COLORS[color];
        card.labels.push({ color, text: c.name });
      }
      saveState();
      renderModalLabels(card);
    };
  });
}

function renderModalSubtasks(card) {
  const listEl = modalEl.querySelector('.subtask-list');
  const progressFill = modalEl.querySelector('.subtask-progress-fill');
  const progressText = modalEl.querySelector('.subtask-progress-text');
  card.subtasks = card.subtasks || [];

  const done = card.subtasks.filter(s => s.done).length;
  const total = card.subtasks.length;
  const pct = total > 0 ? (done / total * 100) : 0;
  progressFill.style.width = pct + '%';
  progressText.textContent = `${done}/${total}`;

  listEl.innerHTML = card.subtasks.map(s => `
    <div class="subtask-item ${s.done ? 'done' : ''}" data-id="${s.id}">
      <div class="subtask-checkbox"></div>
      <div class="subtask-text" contenteditable="true" spellcheck="false">${escapeHtml(s.text)}</div>
      <button class="subtask-delete">&times;</button>
    </div>
  `).join('') || '<div style="color:var(--text-faint);font-size:12px;padding:4px 0">暂无子任务</div>';

  listEl.querySelectorAll('.subtask-item').forEach(item => {
    const subId = item.dataset.id;
    const sub = card.subtasks.find(s => s.id === subId);
    if (!sub) return;

    item.querySelector('.subtask-checkbox').onclick = () => {
      sub.done = !sub.done;
      saveState();
      renderModalSubtasks(card);
    };

    const textEl = item.querySelector('.subtask-text');
    textEl.onblur = () => {
      const newText = textEl.textContent.trim();
      if (newText && newText !== sub.text) {
        sub.text = newText;
        saveState();
      } else {
        textEl.textContent = sub.text;
      }
    };
    textEl.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); textEl.blur(); }
    };

    item.querySelector('.subtask-delete').onclick = () => {
      const idx = card.subtasks.findIndex(s => s.id === subId);
      if (idx !== -1) {
        card.subtasks.splice(idx, 1);
        saveState();
        renderModalSubtasks(card);
      }
    };
  });
}

/* ============================================================

   ============================================================ */
const THEME_KEY = 'kanban-board-theme';

function applyTheme(theme) {
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  // Keep the native (Electron) window background in sync with the theme.
  try { if (window.desktopTheme) window.desktopTheme.set(theme === 'light' ? 'light' : 'dark'); } catch(e) {}
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  // Switch every themed surface atomically. Without this, elements that animate
  // their own background (e.g. .card) would transition from the previous colour
  // and briefly render dark cards on a light background (and vice versa).
  document.documentElement.classList.add('theme-switching');
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
  // Commit the new colours before restoring transitions.
  void document.body.offsetHeight;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.documentElement.classList.remove('theme-switching');
    });
  });
}

document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function getCssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function renderStatsView() {
  const allCards = [];
  getActiveBoard().lists.forEach(list => {
    (list.cards || []).forEach(card => {
      allCards.push({ ...card, listTitle: list.title });
    });
  });

  const now = new Date();
  const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
  const totalCards = allCards.length;
  const weeklyCompleted = allCards.filter(c => c.completedAt && new Date(c.completedAt) >= weekAgo).length;
  const overdue = allCards.filter(c => c.dueDate && new Date(c.dueDate) < now).length;
  const totalLabels = allCards.reduce((sum, c) => sum + (c.labels || []).length, 0);

  document.getElementById('stat-total').textContent = totalCards;
  document.getElementById('stat-weekly').textContent = weeklyCompleted;
  document.getElementById('stat-overdue').textContent = overdue;
  document.getElementById('stat-labels').textContent = totalLabels;

  drawLabelPieChart(allCards);
  drawListHealthChart();
  drawCompletionTrend(allCards);
  drawListCompareChart();
}

function drawLabelPieChart(allCards) {
  const canvas = document.getElementById('chart-labels');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = 300, h = 300;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const labelCounts = {};
  allCards.forEach(card => {
    (card.labels || []).forEach(label => {
      const key = label.color || 'blue';
      labelCounts[key] = (labelCounts[key] || 0) + 1;
    });
  });

  const entries = Object.entries(labelCounts);
  const total = entries.reduce((s, [, c]) => s + c, 0);
  const cx = w / 2, cy = h / 2;
  const outerR = Math.min(w, h) / 2 - 24;
  const innerR = outerR * 0.52;

  if (total === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
    ctx.strokeStyle = getCssVar('--border-overlay');
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('暂无标签数据', cx, cy);
    return;
  }

  let startAngle = -Math.PI / 2;
  entries.forEach(([color, count]) => {
    const c = LABEL_COLORS[color] || LABEL_COLORS.blue;
    const sliceAngle = (count / total) * Math.PI * 2;

    // Draw slice
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, startAngle, startAngle + sliceAngle);
    ctx.arc(cx, cy, innerR, startAngle + sliceAngle, startAngle, true);
    ctx.closePath();
    ctx.fillStyle = c.bg;
    ctx.fill();
    ctx.strokeStyle = getCssVar('--card-bg');
    ctx.lineWidth = 2;
    ctx.stroke();

    // Draw label
    const midAngle = startAngle + sliceAngle / 2;
    const labelR = outerR + 22;
    const lx = cx + Math.cos(midAngle) * labelR;
    const ly = cy + Math.sin(midAngle) * labelR;
    const pct = Math.round((count / total) * 100);
    ctx.fillStyle = getCssVar('--text');
    ctx.font = 'bold 11px -apple-system, sans-serif';
    ctx.textAlign = (midAngle > Math.PI * 0.5 || midAngle < -Math.PI * 0.5) ? 'right' : 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.name + ' ' + pct + '%', lx, ly);

    startAngle += sliceAngle;
  });

  // Center text
  ctx.fillStyle = getCssVar('--text');
  ctx.font = 'bold 14px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(total + ' 个', cx, cy);
}

function drawListHealthChart() {
  const canvas = document.getElementById('chart-lists');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = 400, h = 300;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const lists = state.lists;
  if (lists.length === 0) {
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无列表数据', w / 2, h / 2);
    return;
  }

  const pad = { top: 24, right: 24, bottom: 44, left: 24 };
  const chartW = w - pad.left - pad.right;
  const chartH = h - pad.top - pad.bottom;
  const maxCards = Math.max(...lists.map(l => l.cards.length), 1);
  const barW = Math.min(48, (chartW / lists.length) * 0.6);
  const gap = (chartW - barW * lists.length) / (lists.length + 1);
  const yScale = chartH / maxCards;

  // Axes
  ctx.strokeStyle = getCssVar('--border-overlay');
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top);
  ctx.lineTo(pad.left, h - pad.bottom);
  ctx.lineTo(w - pad.right, h - pad.bottom);
  ctx.stroke();

  // Y gridlines
  ctx.strokeStyle = getCssVar('--border-overlay');
  ctx.globalAlpha = 0.25;
  for (let i = 1; i <= maxCards; i++) {
    const y = h - pad.bottom - i * yScale;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(i, pad.left - 6, y + 4);
  }
  ctx.globalAlpha = 1;

  lists.forEach((list, i) => {
    const x = pad.left + gap + i * (barW + gap);
    const barH = list.cards.length * yScale;
    const y = h - pad.bottom - barH;

    const grad = ctx.createLinearGradient(x, y, x, h - pad.bottom);
    grad.addColorStop(0, '#3b82f6');
    grad.addColorStop(1, '#60a5fa');
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, barW, barH, 5);
    ctx.fill();

    // Count
    ctx.fillStyle = getCssVar('--text');
    ctx.font = 'bold 11px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(list.cards.length, x + barW / 2, y - 10);

    // Label
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    const label = list.title.length > 5 ? list.title.slice(0, 5) + '..' : list.title;
    ctx.fillText(label, x + barW / 2, h - pad.bottom + 18);
  });
}

function drawCompletionTrend(allCards) {
  const canvas = document.getElementById('chart-trend');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = 700, h = 250;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const pad = { top: 16, right: 20, bottom: 36, left: 44 };
  const chartW = w - pad.left - pad.right;
  const chartH = h - pad.top - pad.bottom;

  const now = new Date();
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    days.push(d);
  }

  const dailyCounts = days.map(day => {
    const dayStart = new Date(day.getFullYear(), day.getMonth(), day.getDate());
    const dayEnd = new Date(dayStart.getTime() + 86400000);
    return allCards.filter(c => {
      if (!c.completedAt) return false;
      const compDate = new Date(c.completedAt);
      return compDate >= dayStart && compDate < dayEnd;
    }).length;
  });

  const maxCount = Math.max(...dailyCounts, 1);
  const xStep = chartW / (days.length - 1);
  const yScale = chartH / maxCount;

  // Axes
  ctx.strokeStyle = getCssVar('--border-overlay');
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top);
  ctx.lineTo(pad.left, h - pad.bottom);
  ctx.lineTo(w - pad.right, h - pad.bottom);
  ctx.stroke();

  // Y gridlines
  ctx.strokeStyle = getCssVar('--border-overlay');
  ctx.globalAlpha = 0.25;
  for (let i = 0; i <= maxCount; i++) {
    const y = h - pad.bottom - i * yScale;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(i, pad.left - 8, y + 4);
  }
  ctx.globalAlpha = 1;

  // Area fill
  ctx.beginPath();
  ctx.moveTo(pad.left, h - pad.bottom);
  dailyCounts.forEach((count, i) => {
    ctx.lineTo(pad.left + i * xStep, h - pad.bottom - count * yScale);
  });
  ctx.lineTo(pad.left + (days.length - 1) * xStep, h - pad.bottom);
  ctx.closePath();
  const areaGrad = ctx.createLinearGradient(0, pad.top, 0, h - pad.bottom);
  areaGrad.addColorStop(0, 'rgba(59, 130, 246, 0.25)');
  areaGrad.addColorStop(1, 'rgba(59, 130, 246, 0.02)');
  ctx.fillStyle = areaGrad;
  ctx.fill();

  // Line
  ctx.beginPath();
  dailyCounts.forEach((count, i) => {
    const x = pad.left + i * xStep;
    const y = h - pad.bottom - count * yScale;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Dots
  dailyCounts.forEach((count, i) => {
    if (count > 0) {
      const x = pad.left + i * xStep;
      const y = h - pad.bottom - count * yScale;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#3b82f6';
      ctx.fill();
      ctx.strokeStyle = getCssVar('--card-bg');
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  });

  // X labels
  for (let i = 0; i < days.length; i += 5) {
    const x = pad.left + i * xStep;
    const d = days[i];
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText((d.getMonth() + 1) + '/' + d.getDate(), x, h - pad.bottom + 16);
  }
}

function drawListCompareChart() {
  const canvas = document.getElementById('chart-list-compare');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = 700, h = 250;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const lists = state.lists;
  const pad = { top: 10, right: 60, bottom: 10, left: 120 };
  const chartW = w - pad.left - pad.right;
  const chartH = h - pad.top - pad.bottom;
  const barH = Math.min(32, (chartH / lists.length) - 10);
  const gap = 10;
  const totalH = lists.length * (barH + gap) - gap;
  const startY = pad.top + (chartH - totalH) / 2;

  if (lists.length === 0) {
    ctx.fillStyle = getCssVar('--text-dim');
    ctx.font = '13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无列表数据', w / 2, h / 2);
    return;
  }

  const maxCards = Math.max(...lists.map(l => l.cards.length), 1);
  const xScale = chartW / maxCards;

  lists.forEach((list, i) => {
    const y = startY + i * (barH + gap);
    const bw = Math.max(list.cards.length * xScale, list.cards.length > 0 ? 4 : 0);

    // Label
    ctx.fillStyle = getCssVar('--text');
    ctx.font = '12px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(list.title, pad.left - 12, y + barH / 2);

    // Bar
    if (list.cards.length > 0) {
      const grad = ctx.createLinearGradient(pad.left, 0, pad.left + chartW, 0);
      grad.addColorStop(0, '#3b82f6');
      grad.addColorStop(1, '#60a5fa');
      ctx.fillStyle = grad;
      roundRect(ctx, pad.left, y, bw, barH, 5);
      ctx.fill();
    }

    // Count
    ctx.fillStyle = getCssVar('--text');
    ctx.font = 'bold 12px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(list.cards.length, pad.left + bw + 10, y + barH / 2);
  });
}

/* ============================================================
   Calendar View
   ============================================================ */
let calYear, calMonth, calWeekStart, calViewMode = 'month';

function getAllCardsWithDueDate() {
  const result = [];
  getActiveBoard().lists.forEach(list => {
    (list.cards || []).forEach(card => {
      if (card.dueDate) {
        result.push({ ...card, listTitle: list.title, listId: list.id });
      }
    });
  });
  return result;
}

function getCardsByDate(year, month, day) {
  const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  return getAllCardsWithDueDate().filter(card => {
    if (!card.dueDate) return false;
    return card.dueDate === dateStr;
  });
}

function renderCalendarView() {
  const titleEl = document.getElementById('cal-month-title');
  const gridEl = document.getElementById('cal-grid');

  if (calViewMode === 'month') {
    const now = new Date();
    if (calYear === undefined) calYear = now.getFullYear();
    if (calMonth === undefined) calMonth = now.getMonth();
    titleEl.textContent = `${calYear}年 ${calMonth + 1}月`;
    renderMonthView(gridEl);
  } else {
    const now = new Date();
    if (calWeekStart === undefined) {
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const dayOfWeek = today.getDay();
      calWeekStart = new Date(today.getTime() - dayOfWeek * 86400000);
    }
    const weekEnd = new Date(calWeekStart.getTime() + 6 * 86400000);
    const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    titleEl.textContent = `${calWeekStart.getFullYear()}年 ${monthNames[calWeekStart.getMonth()]} ${calWeekStart.getDate()}日 - ${monthNames[weekEnd.getMonth()]} ${weekEnd.getDate()}日`;
    renderWeekView(gridEl);
  }
}

function renderMonthView(gridEl) {
  const allCards = getAllCardsWithDueDate();
  const firstDay = new Date(calYear, calMonth, 1);
  const startDayOfWeek = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  let html = '';
  const totalCells = 42;

  for (let i = 0; i < totalCells; i++) {
    let day, month, year, isOtherMonth = false;

    if (i < startDayOfWeek) {
      day = daysInPrevMonth - startDayOfWeek + i + 1;
      month = calMonth - 1;
      year = calYear;
      if (month < 0) { month = 11; year = calYear - 1; }
      isOtherMonth = true;
    } else if (i - startDayOfWeek >= daysInMonth) {
      day = i - startDayOfWeek - daysInMonth + 1;
      month = calMonth + 1;
      year = calYear;
      if (month > 11) { month = 0; year = calYear + 1; }
      isOtherMonth = true;
    } else {
      day = i - startDayOfWeek + 1;
      month = calMonth;
      year = calYear;
    }

    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const isToday = year === today.getFullYear() && month === today.getMonth() && day === today.getDate();

    const cardsWithDue = allCards.filter(card => card.dueDate === dateStr);

    html += renderDayCell(day, isOtherMonth, isToday, cardsWithDue, year, month);
  }

  gridEl.innerHTML = html;
  gridEl.className = 'cal-grid';

  attachDayCellEvents();
}

function renderDayCell(day, isOtherMonth, isToday, cardsWithDue, year, month) {
  let cls = 'cal-day';
  if (isOtherMonth) cls += ' other-month';
  if (isToday) cls += ' today';

  const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

  let chipsHtml = '';
  if (cardsWithDue.length > 0) {
    const maxChips = 3;
    chipsHtml = '<div class="cal-day-chips">';
    for (let i = 0; i < Math.min(cardsWithDue.length, maxChips); i++) {
      const card = cardsWithDue[i];
      const labelColor = card.labels && card.labels.length > 0
        ? (LABEL_COLORS[card.labels[0].color] || LABEL_COLORS.blue).bg
        : '#3b82f6';
      chipsHtml += `<div class="cal-day-chip" data-card-id="${card.id}" draggable="false">
        <span class="cal-day-chip-dot" style="background:${labelColor}"></span>
        <span class="cal-day-chip-title">${escapeHtml(card.title)}</span>
      </div>`;
    }
    if (cardsWithDue.length > maxChips) {
      chipsHtml += `<div class="cal-day-chip cal-day-chip-more">+${cardsWithDue.length - maxChips} 更多</div>`;
    }
    chipsHtml += '</div>';
  }

  let dotsHtml = '';
  if (cardsWithDue.length > 3) {
    dotsHtml = '<div class="cal-day-dots"><span class="cal-day-more">+' + (cardsWithDue.length - 3) + '</span></div>';
  }

  return `<div class="${cls}" data-date="${dateStr}" data-has-cards="${cardsWithDue.length > 0 ? '1' : '0'}">
    <div class="cal-day-header">${day}</div>
    ${chipsHtml}
    ${dotsHtml}
  </div>`;
}

function attachDayCellEvents() {
  document.querySelectorAll('#cal-grid .cal-day[data-has-cards="1"]').forEach(cell => {
    cell.addEventListener('click', (e) => {
      e.stopPropagation();
      if (e.target.closest('.cal-day-chip')) return;
      const dateStr = cell.dataset.date;
      openDayPopup(dateStr);
    });
  });
  attachCalCardDrag();
}

function openDayPopup(dateStr) {
  const popup = document.getElementById('cal-day-popup');
  const dateEl = document.getElementById('cal-popup-date');
  const cardsEl = document.getElementById('cal-popup-cards');

  const [y, m, d] = dateStr.split('-').map(Number);
  dateEl.textContent = `${y}年${m}月${d}日`;

  const cards = getCardsByDate(y, m - 1, d);
  cardsEl.innerHTML = cards.length === 0
    ? '<div style="color:var(--text-faint);font-size:13px;padding:8px 0">暂无卡片</div>'
    : cards.map(card => {
        const labelColor = card.labels && card.labels.length > 0
          ? (LABEL_COLORS[card.labels[0].color] || LABEL_COLORS.blue).bg
          : '#3b82f6';
        return `<div class="cal-popup-card" data-card-id="${card.id}">
          <div class="cal-popup-card-title">${escapeHtml(card.title)}</div>
          <div class="cal-popup-card-list">${escapeHtml(card.listTitle)}</div>
        </div>`;
      }).join('');

  popup.style.display = 'flex';

  // Attach card click events
  cardsEl.querySelectorAll('.cal-popup-card').forEach(el => {
    el.addEventListener('click', () => {
      const cardId = el.dataset.cardId;
      openCardById(cardId);
      popup.style.display = 'none';
    });
  });

  // Close button
  popup.querySelector('.cal-popup-close').onclick = () => {
    popup.style.display = 'none';
  };

  // Close on click outside
  const closeOnOutside = (e) => {
    if (!popup.contains(e.target) && !e.target.closest('.cal-day')) {
      popup.style.display = 'none';
      document.removeEventListener('click', closeOnOutside);
    }
  };
  setTimeout(() => document.addEventListener('click', closeOnOutside), 0);
}

function openCardById(cardId) {
  switchView('board');
  // Small delay to let board render
  setTimeout(() => {
    const cardEl = document.querySelector(`.card[data-card-id="${cardId}"]`);
    if (!cardEl && isFilterActive()) {
      // Card hidden by current search/filter: clear filters and retry
      searchQuery = '';
      filterLabels.clear();
      filterDue.clear();
      document.getElementById('search-input').value = '';
      applySearchStateUI();
      updateSearchCount();
      setTimeout(() => openCardById(cardId), 120);
      return;
    }
    if (cardEl) {
      const list = state.lists.find(l => l.cards.some(c => c.id === cardId));
      const card = list ? list.cards.find(c => c.id === cardId) : null;
      if (card && list) {
        openModal(cardEl, card, list.id);
      }
    }
  }, 200);
}

function renderWeekView(gridEl) {
  const allCards = getAllCardsWithDueDate();
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const weekDayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  let html = '<div class="week-container">';

  for (let i = 0; i < 7; i++) {
    const day = new Date(calWeekStart.getTime() + i * 86400000);
    const dateStr = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;
    const isToday = day.getTime() === today.getTime();
    const cardsOnDay = allCards.filter(card => card.dueDate === dateStr);

    html += `<div class="week-day${isToday ? ' today' : ''}" data-date="${dateStr}">
      <div class="week-day-header">
        <span class="week-day-date">${day.getMonth() + 1}/${day.getDate()}</span>
        <span class="week-day-label">${weekDayNames[day.getDay()]}</span>
        <span class="week-day-count">${cardsOnDay.length} 张卡片</span>
      </div>`;

    if (cardsOnDay.length === 0) {
      html += '<div style="color:var(--text-faint);font-size:12px;padding:4px 0">暂无到期卡片</div>';
    } else {
      cardsOnDay.forEach(card => {
        const labelColor = card.labels && card.labels.length > 0
          ? (LABEL_COLORS[card.labels[0].color] || LABEL_COLORS.blue).bg
          : '#3b82f6';
        html += `<div class="week-card" data-card-id="${card.id}">
          <span class="week-card-dot" style="background:${labelColor}"></span>
          <div class="week-card-info">
            <div class="week-card-title">${escapeHtml(card.title)}</div>
            <div class="week-card-list">${escapeHtml(card.listTitle)}</div>
          </div>
        </div>`;
      });
    }

    html += '</div>';
  }

  html += '</div>';
  gridEl.innerHTML = html;
  gridEl.className = '';

  // Attach card click events
  gridEl.querySelectorAll('.week-card').forEach(el => {
    el.addEventListener('click', () => {
      const cardId = el.dataset.cardId;
      openCardById(cardId);
    });
  });
  attachCalCardDrag();
}

/* ============================================================
   Calendar Drag to Reschedule
   ============================================================ */
function resetCalendarPosition() {
  calYear = undefined;
  calMonth = undefined;
  calWeekStart = undefined;
}

function findCardAndList(cardId) {
  for (const list of getActiveBoard().lists) {
    const card = list.cards.find(c => c.id === cardId);
    if (card) return { card, list };
  }
  return null;
}

function getTargetDateFromPoint(clientX, clientY) {
  const cells = document.querySelectorAll('#cal-grid .cal-day[data-date], #cal-grid .week-day[data-date]');
  for (const cell of cells) {
    const r = cell.getBoundingClientRect();
    if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) {
      return cell;
    }
  }
  return null;
}

function rescheduleCard(cardId, newDateStr) {
  const found = findCardAndList(cardId);
  if (!found || !found.card.dueDate || found.card.dueDate === newDateStr) return;
  snapshotForUndo();
  const oldDate = found.card.dueDate;
  found.card.dueDate = newDateStr;
  saveState();
  renderCalendarView();
  renderBoard();
  const [y, m, d] = newDateStr.split('-').map(Number);
  showToast(`「${found.card.title}」已改期至 ${m}月${d}日`, null, '撤销', () => {
    found.card.dueDate = oldDate;
    saveState();
    renderCalendarView();
    renderBoard();
    showToast('已撤销改期');
  });
}

let calDragCtx = null;

function attachCalCardDrag() {
  const cardsEls = document.querySelectorAll('#cal-grid .cal-day-chip[data-card-id], #cal-grid .week-card[data-card-id]');
  cardsEls.forEach(el => {
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      const cardId = el.dataset.cardId;
      const found = findCardAndList(cardId);
      if (!found) return;
      const startX = e.clientX, startY = e.clientY;
      let started = false;
      let ghost = null;
      let hoverCell = null;

      const cleanup = () => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        if (ghost) ghost.remove();
        if (hoverCell) hoverCell.classList.remove('drag-over-day');
        el.classList.remove('dragging');
      };

      function onMove(ev) {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (!started && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
          started = true;
          ghost = document.createElement('div');
          ghost.className = 'cal-drag-ghost';
          ghost.textContent = found.card.title;
          document.body.appendChild(ghost);
          el.classList.add('dragging');
        }
        if (!started) return;
        ev.preventDefault();
        ghost.style.left = (ev.clientX + 12) + 'px';
        ghost.style.top = (ev.clientY + 10) + 'px';
        const cell = getTargetDateFromPoint(ev.clientX, ev.clientY);
        if (cell !== hoverCell) {
          if (hoverCell) hoverCell.classList.remove('drag-over-day');
          hoverCell = cell;
          if (hoverCell) hoverCell.classList.add('drag-over-day');
        }
      }

      function onUp(ev) {
        if (started) {
          const cell = getTargetDateFromPoint(ev.clientX, ev.clientY);
          if (cell && cell.dataset.date) rescheduleCard(cardId, cell.dataset.date);
        }
        cleanup();
      }

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}

});

document.getElementById('cal-today-btn').addEventListener('click', () => {

document.querySelectorAll('.cal-toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const view = btn.dataset.calview;
    calViewMode = view;
    document.querySelectorAll('.cal-toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.calview === view));
    document.querySelector('.cal-weekdays').style.display = view === 'month' ? '' : 'none';
    renderCalendarView();
  });
});

/* ============================================================
   Notification System

  Notification.requestPermission();
}

// 每 30 分钟检查到期卡片
function checkDueNotifications() {
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const today = new Date().toISOString().split('T')[0];
  getActiveBoard().lists.forEach(list => {
    list.cards.forEach(card => {
      if (card.dueDate === today && !card.completedAt) {
        new Notification('\u{1f4cb} 今日到期提醒', { body: `"${card.title}" 今天到期！` });
      }
    });
  });
}
setInterval(checkDueNotifications, 30 * 60 * 1000);
setTimeout(checkDueNotifications, 5000);

/* ============================================================
   AI Summary Engine
   ============================================================ */

function getAllCardsWithContext() {
  const cards = [];
  getActiveBoard().lists.forEach(list => {
    (list.cards || []).forEach(card => {
      cards.push({
        title: card.title,
        description: card.description || '',
        listTitle: list.title,
        labels: (card.labels || []).map(l => {
          const c = LABEL_COLORS[l.color] || {};
          return (l.text || c.name || l.color);
        }).join(', '),
        subtaskTotal: (card.subtasks || []).length,
        subtaskDone: (card.subtasks || []).filter(s => s.done).length,
        dueDate: card.dueDate,
        createdAt: card.createdAt,
        completedAt: card.completedAt,
      });
    });
  });
  return cards;
}

function generateRuleSummary() {
  const cards = getAllCardsWithContext();
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const sevenDaysAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

  // 即将到期 (未来3天内)
  const threeDaysLater = new Date(today.getTime() + 3 * 24 * 60 * 60 * 1000);
  const upcoming = cards.filter(c => {
    if (!c.dueDate || c.completedAt) return false;
    const due = new Date(c.dueDate);
    return due >= today && due <= threeDaysLater;
  });

  // 已过期
  const overdue = cards.filter(c => {
    if (!c.dueDate || c.completedAt) return false;
    const due = new Date(c.dueDate);
    return due < today;
  });

  // 长期停滞 (>7天未完成且未更新)
  const stagnant = cards.filter(c => {
    if (c.completedAt) return false;
    const created = new Date(c.createdAt);
    return created < sevenDaysAgo;
  });

  const totalCards = cards.length;
  const completedCards = cards.filter(c => c.completedAt).length;
  const activeCards = cards.filter(c => !c.completedAt).length;

  let html = '';

  // 总览
  html += `<h4>看板总览</h4>`;
  html += `<p>总计 <strong>${totalCards}</strong> 张卡片，已完成 <strong class="ai-success">${completedCards}</strong> 张，进行中 <strong>${activeCards}</strong> 张。</p>`;

  if (overdue.length > 0) {
    html += `<h4><span class="ai-danger">已过期 (${overdue.length})</span></h4><ul>`;
    overdue.forEach(c => {
      html += `<li>${escapeHtml(c.title)} <span class="ai-danger">[${c.listTitle}]</span></li>`;
    });
    html += '</ul>';
  }

  if (upcoming.length > 0) {
    html += `<h4><span class="ai-warning">即将到期 (${upcoming.length})</span></h4><ul>`;
    upcoming.forEach(c => {
      html += `<li>${escapeHtml(c.title)} <span class="ai-warning">[${formatDate(c.dueDate)}]</span></li>`;
    });
    html += '</ul>';
  }

  if (stagnant.length > 0) {
    html += `<h4>长期停滞 >7天 (${stagnant.length})</h4><ul>`;
    stagnant.forEach(c => {
      html += `<li>${escapeHtml(c.title)} <span style="color:var(--text-faint)">[${c.listTitle}]</span></li>`;
    });
    html += '</ul>';
  }

  if (overdue.length === 0 && upcoming.length === 0) {
    html += `<p class="ai-success">所有事项正常，没有过期或即将到期的卡片。</p>`;
  }

  return html;
}

function generateWeeklyReport() {
  const cards = getAllCardsWithContext();
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

  // 本周完成
  const weeklyCompleted = cards.filter(c => {
    if (!c.completedAt) return false;
    const compDate = new Date(c.completedAt);
    return compDate >= weekAgo;
  });

  // 本周新增
  const weeklyNew = cards.filter(c => {
    if (!c.createdAt) return false;
    const created = new Date(c.createdAt);
    return created >= weekAgo;
  });

  // 进行中
  const inProgress = cards.filter(c => !c.completedAt);

  const weekStart = new Date(weekAgo);
  const weekStartStr = (weekStart.getMonth() + 1) + '月' + weekStart.getDate() + '日';
  const todayStr = (today.getMonth() + 1) + '月' + today.getDate() + '日';

  let md = '';
  md += `# 周报 (${weekStartStr} - ${todayStr})\n\n`;

  md += `## 概览\n`;
  md += `- 本周完成：${weeklyCompleted.length} 张\n`;
  md += `- 本周新增：${weeklyNew.length} 张\n`;
  md += `- 进行中：${inProgress.length} 张\n\n`;

  if (weeklyCompleted.length > 0) {
    md += `## 本周完成\n`;
    weeklyCompleted.forEach(c => {
      md += `- [${c.listTitle}] ${c.title}\n`;
    });
    md += '\n';
  }

  if (weeklyNew.length > 0) {
    md += `## 本周新增\n`;
    weeklyNew.forEach(c => {
      md += `- [${c.listTitle}] ${c.title}\n`;
    });
    md += '\n';
  }

  if (inProgress.length > 0) {
    md += `## 进行中\n`;
    inProgress.forEach(c => {
      const dueSuffix = c.dueDate ? ` (${formatDate(c.dueDate)}到期)` : '';
      md += `- [${c.listTitle}] ${c.title}${dueSuffix}\n`;
    });
    md += '\n';
  }

  return md;
}

function generateRulePrompt() {
  const cards = getAllCardsWithContext();
  const now = new Date();
  const todayStr = now.toISOString().split('T')[0];

  let prompt = `当前日期：${todayStr}\n\n`;
  prompt += '以下是看板中所有卡片的数据：\n\n';

  getActiveBoard().lists.forEach(list => {
    prompt += `## 列表：${list.title}\n`;
    if (list.cards.length === 0) {
      prompt += '(空)\n\n';
    } else {
      list.cards.forEach(card => {
        prompt += `- 标题：${card.title}\n`;
        if (card.description) prompt += `  描述：${card.description}\n`;
        if (card.labels && card.labels.length) {
          const labelTexts = card.labels.map(l => l.text || (LABEL_COLORS[l.color] ? LABEL_COLORS[l.color].name : l.color)).join(', ');
          prompt += `  标签：${labelTexts}\n`;
        }
        if (card.dueDate) prompt += `  到期日：${card.dueDate}\n`;
        const subtaskDone = (card.subtasks || []).filter(s => s.done).length;
        const subtaskTotal = (card.subtasks || []).length;
        if (subtaskTotal > 0) prompt += `  子任务：${subtaskDone}/${subtaskTotal}\n`;
        if (card.completedAt) prompt += `  完成时间：${card.completedAt}\n`;
        prompt += '\n';
      });
    }
  });

  return prompt;
}

/* ============================================================
   AI Settings Management
   ============================================================ */

function getAIConfig() {
  return {
    endpoint: state.aiEndpoint || 'https://api.deepseek.com/chat/completions',
    apiKey: state.aiApiKey || '',
    model: state.aiModel || 'deepseek-chat',
  };
}

function saveAIConfig(endpoint, apiKey, model) {
  state.aiEndpoint = endpoint;
  state.aiApiKey = apiKey;
  state.aiModel = model;
  saveState();
}

function openAISettings() {
  const config = getAIConfig();
  document.getElementById('ai-endpoint-input').value = config.endpoint;
  document.getElementById('ai-apikey-input').value = config.apiKey;
  document.getElementById('ai-model-input').value = config.model;
  document.getElementById('ai-settings-modal').style.display = 'flex';
}

function closeAISettings() {
  document.getElementById('ai-settings-modal').style.display = 'none';
}

// AI Settings button
document.getElementById('ai-settings-btn').addEventListener('click', openAISettings);

// Save button
document.getElementById('ai-save-btn').addEventListener('click', () => {
  const endpoint = document.getElementById('ai-endpoint-input').value.trim();
  const apiKey = document.getElementById('ai-apikey-input').value.trim();
  const model = document.getElementById('ai-model-input').value.trim();
  saveAIConfig(endpoint, apiKey, model);
  closeAISettings();
});

// Cancel button
document.getElementById('ai-cancel-btn').addEventListener('click', closeAISettings);

// Close settings modal on overlay click
document.getElementById('ai-settings-modal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeAISettings();
});

/* ============================================================
   AI API Call
   ============================================================ */

async function callAI(prompt) {
  const config = getAIConfig();
  if (!config.apiKey) return null;

  try {
    const response = await fetch(config.endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${config.apiKey}`,
      },
      body: JSON.stringify({
        model: config.model,
        messages: [
          { role: 'system', content: '你是一个项目管理助手，帮助用户分析看板数据并提供简洁的摘要和建议。请用中文回复。' },
          { role: 'user', content: prompt },
        ],
        temperature: 0.7,
        max_tokens: 2000,
      }),
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API 请求失败 (${response.status}): ${errText}`);
    }

    const data = await response.json();
    return data.choices && data.choices[0] && data.choices[0].message
      ? data.choices[0].message.content
      : null;
  } catch (e) {
    console.error('AI API 调用失败:', e);
    return null;
  }
}

/* ============================================================
   AI Summary Actions
   ============================================================ */

const aiSummaryEl = document.getElementById('ai-summary');
const aiGenerateBtn = document.getElementById('ai-generate-btn');
const aiWeeklyBtn = document.getElementById('ai-weekly-btn');

// 生成今日摘要
aiGenerateBtn.addEventListener('click', async () => {
  aiGenerateBtn.disabled = true;
  aiGenerateBtn.textContent = '生成中...';
  aiSummaryEl.innerHTML = '<div class="ai-placeholder">正在生成摘要...</div>';

  // 先使用规则引擎生成摘要
  const ruleSummary = generateRuleSummary();
  aiSummaryEl.innerHTML = ruleSummary;

  // 如果配置了 API Key，尝试用 AI 增强
  const config = getAIConfig();
  if (config.apiKey) {
    const prompt = generateRulePrompt() + '\n请根据以上看板数据，生成一份简洁的中文项目摘要，包含：\n1. 总体情况概览\n2. 需要关注的风险项（过期、即将到期等）\n3. 建议优先处理的事项\n请用 HTML 格式输出，使用 <h4> 作为小标题，<ul><li> 作为列表项。';
    const aiResult = await callAI(prompt);
    if (aiResult) {
      aiSummaryEl.innerHTML = '<div style="margin-bottom:10px;font-size:11px;color:var(--text-faint);">AI 增强摘要</div>' + aiResult;
    }
  }

  aiGenerateBtn.disabled = false;
  aiGenerateBtn.textContent = '\u2728 生成今日摘要';
});

// 生成周报
aiWeeklyBtn.addEventListener('click', async () => {
  aiWeeklyBtn.disabled = true;
  aiWeeklyBtn.textContent = '生成中...';

  // 先用规则引擎生成 Markdown 周报
  const weeklyMd = generateWeeklyReport();

  // 如果配置了 API Key，尝试用 AI 润色
  const config = getAIConfig();
  if (config.apiKey) {
    const prompt = generateRulePrompt() + '\n请根据以上看板数据，生成一份专业的中文项目周报，包含：\n1. 本周概览（完成数、新增数、进行中数）\n2. 本周完成事项\n3. 本周新增事项\n4. 进行中事项及进展\n5. 下周计划建议\n请用 Markdown 格式输出。';
    const aiResult = await callAI(prompt);
    if (aiResult) {
      aiSummaryEl.innerHTML = '<div style="margin-bottom:10px;font-size:11px;color:var(--text-faint);">AI 润色周报</div><pre>' + escapeHtml(aiResult) + '</pre>';
      aiWeeklyBtn.disabled = false;
      aiWeeklyBtn.textContent = '\u{1f4cb} 生成周报';
      return;
    }
  }

  // 使用规则引擎的结果
  aiSummaryEl.innerHTML = '<pre>' + escapeHtml(weeklyMd) + '</pre>';
  aiWeeklyBtn.disabled = false;
  aiWeeklyBtn.textContent = '\u{1f4cb} 生成周报';
});
