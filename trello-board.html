<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东青Trello看板</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a1428;
  --bg-elev: #0f2040;
  --list-bg: rgba(15, 32, 64, 0.45);
  --list-border: rgba(100, 180, 255, 0.1);
  --card-bg: rgba(20, 42, 75, 0.5);
  --card-bg-hover: rgba(28, 55, 95, 0.55);
  --text: #ffffff;
  --text-dim: #a0b4cc;
  --text-faint: #6a7e98;
  --accent: #3b82f6;
  --accent-2: #60a5fa;
  --accent-grad: linear-gradient(135deg, #3b82f6, #60a5fa);
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #eab308;
  --radius: 22px;
  --radius-sm: 14px;
  --shadow-card: 0 0 0 1px rgba(100,180,255,0.04), inset 0 1px 0 rgba(255,255,255,0.03);
  --shadow-card-hover: 0 0 0 1px rgba(100,180,255,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
  --shadow-drag: 0 12px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(100,180,255,0.15);
  --shadow-modal: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(100,180,255,0.08);
  --transition: 0.2s cubic-bezier(0.2, 0, 0, 1);
  --flip-duration: 0.32s;
  --flip-easing: cubic-bezier(0.2, 0, 0, 1);
  /* Surface & overlay tokens */
  --hover-overlay: rgba(100,180,255,0.06);
  --hover-overlay-strong: rgba(100,180,255,0.1);
  --border-overlay: rgba(100,180,255,0.08);
  --border-overlay-strong: rgba(100,180,255,0.14);
  --input-bg: rgba(0,0,0,0.2);
  --input-bg-light: rgba(0,0,0,0.15);
  --header-bg: rgba(10, 20, 40, 0.55);
  --header-border: rgba(100,180,255,0.06);
  --overlay-bg: rgba(5, 12, 28, 0.65);
  --scrollbar-thumb: rgba(100,180,255,0.1);
  --scrollbar-thumb-hover: rgba(100,180,255,0.2);
  --shadow-list: 0 0 0 1px rgba(100,180,255,0.04);
  --surface-tint: rgba(100,180,255,0.04);
  --surface-tint-light: rgba(100,180,255,0.025);
  --bg-glow-1: rgba(59, 130, 246, 0.12);
  --bg-glow-2: rgba(96, 165, 250, 0.08);
  --bg-glow-3: rgba(30, 64, 175, 0.06);
  --context-shadow: 0 8px 24px rgba(0,0,0,0.4);
  --context-border: rgba(100,180,255,0.1);
}

/* ===== Light Theme ===== */
[data-theme="light"] {
  --bg: #f0f4f8;
  --bg-elev: #ffffff;
  --list-bg: rgba(222, 229, 238, 0.72);
  --list-border: rgba(15, 23, 42, 0.08);
  --card-bg: rgba(255, 255, 255, 0.94);
  --card-bg-hover: rgba(255, 255, 255, 1);
  --text: #1e293b;
  --text-dim: #64748b;
  --text-faint: #94a3b8;
  --shadow-card: 0 0 0 1px rgba(15,23,42,0.05), 0 1px 3px rgba(15,23,42,0.08);
  --shadow-card-hover: 0 0 0 1px rgba(59,130,246,0.25), 0 4px 12px rgba(15,23,42,0.1);
  --shadow-drag: 0 12px 32px rgba(0,0,0,0.12), 0 0 0 1px rgba(59,130,246,0.1);
  --shadow-modal: 0 24px 64px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.04);
  --hover-overlay: rgba(59,130,246,0.05);
  --hover-overlay-strong: rgba(59,130,246,0.08);
  --border-overlay: rgba(0,0,0,0.06);
  --border-overlay-strong: rgba(0,0,0,0.1);
  --input-bg: rgba(0,0,0,0.03);
  --input-bg-light: rgba(0,0,0,0.02);
  --header-bg: rgba(255, 255, 255, 0.65);
  --header-border: rgba(0,0,0,0.05);
  --overlay-bg: rgba(15, 23, 42, 0.2);
  --scrollbar-thumb: rgba(0,0,0,0.1);
  --scrollbar-thumb-hover: rgba(0,0,0,0.18);
  --shadow-list: 0 0 0 1px rgba(15,23,42,0.04), 0 6px 18px rgba(15,23,42,0.06);
  --surface-tint: rgba(59,130,246,0.03);
  --surface-tint-light: rgba(59,130,246,0.02);
  --bg-glow-1: rgba(59, 130, 246, 0.04);
  --bg-glow-2: rgba(96, 165, 250, 0.03);
  --bg-glow-3: rgba(30, 64, 175, 0.02);
  --context-shadow: 0 8px 24px rgba(0,0,0,0.1);
  --context-border: rgba(0,0,0,0.06);
}
html {
  background: var(--bg);
}
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--text);
  overflow: hidden;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body {
  background: var(--bg);
  background-image:
    linear-gradient(180deg, var(--bg) 0%, var(--bg-elev) 100%),
    radial-gradient(ellipse at 15% 0%, var(--bg-glow-1) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 100%, var(--bg-glow-2) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 50%, var(--bg-glow-3) 0%, transparent 60%);
  background-attachment: fixed;
}
[data-theme="light"] body {
  background-image:
    linear-gradient(180deg, #f0f4f8 0%, #e8eef5 100%),
    radial-gradient(ellipse at 15% 0%, var(--bg-glow-1) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 100%, var(--bg-glow-2) 0%, transparent 55%);
}

/* Theme switching: disable all transitions for one frame so every themed surface
   (page, header, lists, cards) repaints to the new palette atomically. Otherwise
   elements that animate their own background (e.g. .card) would tween from the
   previous colour and briefly show dark cards on a light background. */
html.theme-switching,
html.theme-switching *,
html.theme-switching *::before,
html.theme-switching *::after {
  transition: none !important;
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

/* ===== Header ===== */
#header {
  height: 60px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px 0 80px;
  background: var(--header-bg);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-bottom: 1px solid var(--header-border);
  position: relative;
  z-index: 100;
  flex-shrink: 0;
  -webkit-app-region: drag;
  user-select: none;
  -webkit-user-select: none;
}
/* Buttons inside header should not be draggable */
#header button, #header #board-title {
  -webkit-app-region: no-drag;
}
#board-title {
  display: none;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  user-select: none;
  -webkit-user-select: none;
}
.header-spacer { flex: 1; }

#tool-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: var(--hover-overlay);
  border: 1px solid var(--border-overlay);
  border-radius: 12px;
  cursor: pointer;
  transition: all var(--transition);
  flex-shrink: 0;
}
#tool-btn svg { width: 18px; height: 18px; color: var(--accent); transition: all 0.3s ease; }
#tool-btn:hover { background: var(--hover-overlay-strong); border-color: var(--border-overlay-strong); transform: translateY(-1px); }
#tool-btn:hover svg { color: var(--accent-2); }

#theme-toggle {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: var(--hover-overlay);
  border: 1px solid var(--border-overlay);
  border-radius: 12px;
  cursor: pointer;
  transition: all var(--transition);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
#theme-toggle:hover { background: var(--hover-overlay-strong); border-color: var(--border-overlay-strong); transform: translateY(-1px); }
#theme-toggle svg { width: 18px; height: 18px; color: var(--accent); transition: all 0.3s ease; }
#theme-toggle:hover svg { color: var(--accent-2); }
#theme-toggle .icon-sun { display: none; }
#theme-toggle .icon-moon { display: block; }
[data-theme="light"] #theme-toggle .icon-sun { display: block; }
[data-theme="light"] #theme-toggle .icon-moon { display: none; }

#add-list-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  background: var(--accent-grad);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
  white-space: nowrap;
}
#add-list-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(59,130,246,0.3); }
#add-list-btn:active { transform: translateY(0); }

/* ===== View Switcher ===== */
.view-switcher {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px;
  background: var(--hover-overlay);
  border: 1px solid var(--border-overlay);
  border-radius: 14px;
  -webkit-app-region: no-drag;
}
.view-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 12px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all var(--transition);
  -webkit-app-region: no-drag;
}
.view-btn:hover {
  background: var(--hover-overlay-strong);
  color: var(--text);
}
.view-btn.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(59,130,246,0.3);
}
.view-btn.active:hover {
  background: var(--accent-2);
  color: #fff;
}
.view-btn svg {
  width: 18px;
  height: 18px;
}

/* ===== Board ===== */
#board {
  display: flex;
  gap: 16px;
  padding: 16px 24px 8px;
  overflow-x: auto;
  overflow-y: hidden;
  height: calc(100vh - 60px);
  align-items: flex-start;
}
body.has-toolbar #board {
  height: calc(100vh - 106px);
}

/* ===== List ===== */
.list {
  display: flex;
  flex-direction: column;
  width: 290px;
  min-width: 290px;
  max-height: calc(100vh - 60px - 24px);
  background: var(--list-bg);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--list-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-list);
  overflow: hidden;
  position: relative;
}
.list.dragging { opacity: 0.3; }
.list-list-header-dragging { cursor: grabbing; }

.list-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 14px 8px;
  flex-shrink: 0;
}
.list-title {
  flex: 1;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  padding: 5px 8px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  cursor: grab;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.list-title:focus {
  outline: none;
  background: var(--input-bg);
  border-color: var(--accent);
  cursor: text;
}
.list-count {
  font-size: 11px;
  color: var(--accent-2);
  background: var(--hover-overlay);
  padding: 2px 8px;
  border-radius: 10px;
  flex-shrink: 0;
  font-weight: 600;
}
.list-menu-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  color: var(--text-dim);
  border-radius: 8px;
  cursor: pointer;
  font-size: 18px;
  transition: all var(--transition);
  flex-shrink: 0;
}
.list-menu-btn:hover { background: var(--hover-overlay-strong); color: var(--text); }

.list-cards {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 10px 4px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 8px;
}

.list-footer {
  padding: 8px 10px 12px;
  flex-shrink: 0;
}
.add-card-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 10px 12px;
  background: transparent;
  border: 1px dashed var(--border-overlay-strong);
  border-radius: 12px;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all var(--transition);
}
.add-card-btn:hover { background: var(--surface-tint); color: var(--accent-2); border-color: var(--accent); }

.add-card-form { display: flex; flex-direction: column; gap: 8px; }
.add-card-form textarea {
  width: 100%;
  min-height: 60px;
  padding: 8px 10px;
  background: var(--input-bg);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  resize: none;
  outline: none;
}
.add-card-form-actions { display: flex; gap: 8px; align-items: center; }
.btn-confirm {
  padding: 6px 14px;
  background: var(--accent-grad);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--transition);
}
.btn-confirm:hover { transform: translateY(-1px); }
.btn-cancel {
  width: 28px; height: 28px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 20px;
  cursor: pointer;
  border-radius: 6px;
  transition: all var(--transition);
}
.btn-cancel:hover { background: var(--hover-overlay-strong); color: var(--text); }

/* ===== Card ===== */
.card {
  background: var(--card-bg);
  backdrop-filter: blur(16px) saturate(150%);
  -webkit-backdrop-filter: blur(16px) saturate(150%);
  border: 1px solid var(--border-overlay);
  border-radius: 14px;
  padding: 12px 14px;
  cursor: pointer;
  box-shadow: var(--shadow-card);
  transition: background var(--transition), box-shadow var(--transition), border-color var(--transition);
  position: relative;
  user-select: none;
}
.card:hover { background: var(--card-bg-hover); box-shadow: var(--shadow-card-hover); border-color: var(--border-overlay-strong); }
.card.dragging { visibility: hidden; }
.card-ghost {
  position: fixed !important;
  z-index: 9999;
  pointer-events: none;
  box-shadow: var(--shadow-drag) !important;
  opacity: 0.95;
  transform: rotate(3deg);
  transition: none !important;
  will-change: transform;
}

.card-labels {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 6px;
}
.card-label {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.card-title { font-size: 13px; line-height: 1.4; word-break: break-word; color: var(--text); }
.card-badges {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-dim);
}
.card-badge { display: flex; align-items: center; gap: 3px; }
.card-badge svg { width: 12px; height: 12px; color: var(--accent); }

/* Drop indicator */
.drop-indicator {
  height: 3px;
  background: var(--accent);
  border-radius: 2px;
  margin: -2px 0;
  box-shadow: 0 0 12px rgba(59,130,246,0.6);
  animation: pulse-indicator 1s ease-in-out infinite;
}
@keyframes pulse-indicator {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

/* ===== Add List Placeholder ===== */
.add-list-placeholder {
  width: 290px;
  min-width: 290px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: var(--surface-tint);
  border: 1px dashed var(--border-overlay-strong);
  border-radius: var(--radius);
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all var(--transition);
}
.add-list-placeholder:hover { background: var(--hover-overlay); color: var(--accent-2); border-color: var(--accent); }
.add-list-placeholder textarea {
  width: 100%;
  padding: 8px 10px;
  background: var(--input-bg);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  resize: none;
  outline: none;
}

/* ===== Modal ===== */
#modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(8px) saturate(120%);
  -webkit-backdrop-filter: blur(8px) saturate(120%);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}
#modal-overlay.active { display: flex; opacity: 1; }

#modal {
  width: 680px;
  max-width: 92vw;
  max-height: 86vh;
  background: var(--bg-elev);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--border-overlay);
  border-radius: 24px;
  box-shadow: var(--shadow-modal);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: fixed;
  transform-origin: center center;
  will-change: transform, opacity;
}
.modal-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 22px 26px 12px;
  flex-shrink: 0;
}
.modal-header-icon {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-grad);
  border-radius: 10px;
  flex-shrink: 0;
  margin-top: 2px;
}
.modal-header-icon svg { width: 18px; height: 18px; color: #fff; }
.modal-title-wrap { flex: 1; min-width: 0; }
.modal-title {
  font-size: 19px;
  font-weight: 700;
  color: var(--text);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 5px 10px;
  width: 100%;
  outline: none;
  cursor: text;
}
.modal-title:focus { background: var(--input-bg); border-color: var(--accent); }
.modal-subtitle { font-size: 12px; color: var(--text-faint); padding: 0 10px; margin-top: 2px; }
.modal-close {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 22px;
  cursor: pointer;
  border-radius: 10px;
  transition: all var(--transition);
  flex-shrink: 0;
}
.modal-close:hover { background: var(--hover-overlay-strong); color: var(--text); }

.modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 26px 26px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.modal-section h3 {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent-2);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.modal-section h3 svg { width: 14px; height: 14px; color: var(--accent); }

/* Labels in modal */
.modal-labels {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}
.modal-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: default;
  position: relative;
}
.modal-label-text {
  outline: none;
  cursor: text;
  border-radius: 4px;
  padding: 1px 2px;
  min-width: 20px;
}
.modal-label-text:focus {
  background: rgba(0,0,0,0.2);
}
.modal-label-remove {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.2);
  border: none;
  border-radius: 50%;
  color: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: background var(--transition);
}
.modal-label-remove:hover { background: rgba(0,0,0,0.4); }

.label-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.label-color-btn {
  width: 38px; height: 30px;
  border: 2px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}
.label-color-btn:hover { transform: scale(1.08); }
.label-color-btn.active { border-color: #fff; }
.label-color-btn.active::after {
  content: '✓';
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}

/* Description */
.modal-desc {
  width: 100%;
  min-height: 80px;
  padding: 12px 14px;
  background: var(--input-bg-light);
  border: 1px solid var(--border-overlay);
  border-radius: 12px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  resize: vertical;
  outline: none;
  transition: border-color var(--transition);
}
.modal-desc:focus { border-color: var(--accent); }

/* Subtasks */
.subtask-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.subtask-progress-bar {
  flex: 1;
  height: 6px;
  background: var(--border-overlay);
  border-radius: 3px;
  overflow: hidden;
}
.subtask-progress-fill {
  height: 100%;
  background: var(--accent-grad);
  border-radius: 3px;
  transition: width 0.3s cubic-bezier(0.2, 0, 0, 1);
}
.subtask-progress-text { font-size: 12px; color: var(--accent-2); font-weight: 600; white-space: nowrap; }

.subtask-list { display: flex; flex-direction: column; gap: 4px; }
.subtask-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--surface-tint-light);
  border: 1px solid var(--surface-tint);
  border-radius: 12px;
  transition: all var(--transition);
}
.subtask-item:hover { background: var(--hover-overlay); border-color: var(--border-overlay); }
.subtask-item.done .subtask-text { text-decoration: line-through; color: var(--text-faint); }

.subtask-checkbox {
  width: 18px; height: 18px;
  border: 2px solid var(--text-faint);
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.subtask-item.done .subtask-checkbox {
  background: var(--accent-grad);
  border-color: transparent;
}
.subtask-item.done .subtask-checkbox::after {
  content: '✓';
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}
.subtask-text {
  flex: 1;
  font-size: 13px;
  color: var(--text);
  background: transparent;
  border: none;
  outline: none;
  cursor: text;
}
.subtask-delete {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  color: var(--text-faint);
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  opacity: 0;
  transition: all var(--transition);
  flex-shrink: 0;
}
.subtask-item:hover .subtask-delete { opacity: 1; }
.subtask-delete:hover { background: rgba(239,68,68,0.15); color: var(--danger); }

.subtask-add {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.subtask-add input {
  flex: 1;
  padding: 10px 14px;
  background: var(--input-bg-light);
  border: 1px solid var(--border-overlay);
  border-radius: 12px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color var(--transition);
}
.subtask-add input:focus { border-color: var(--accent); }
.subtask-add button {
  padding: 10px 18px;
  background: rgba(59,130,246,0.15);
  border: 1px solid rgba(59,130,246,0.3);
  color: var(--accent-2);
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.subtask-add button:hover { background: rgba(59,130,246,0.25); }

.modal-footer {
  padding: 14px 26px;
  border-top: 1px solid var(--border-overlay);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.modal-delete-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.2);
  color: var(--danger);
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.modal-delete-btn:hover { background: rgba(239,68,68,0.2); }
.modal-list-badge { font-size: 12px; color: var(--text-faint); }

/* ===== Context Menu ===== */
.context-menu {
  position: fixed;
  z-index: 5000;
  background: var(--bg-elev);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--context-border);
  border-radius: 14px;
  box-shadow: var(--context-shadow);
  padding: 6px;
  min-width: 160px;
  display: none;
}
.context-menu.active { display: block; }
.context-menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  transition: background var(--transition);
}
.context-menu-item:hover { background: var(--hover-overlay); }
.context-menu-item.danger { color: var(--danger); }
.context-menu-item.danger:hover { background: rgba(239,68,68,0.1); }

/* ===== Due Date ===== */
.due-date-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-due-input {
  flex: 1;
  padding: 10px 14px;
  background: var(--input-bg-light);
  border: 1px solid var(--border-overlay);
  border-radius: 12px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  color-scheme: dark;
  transition: border-color var(--transition);
}
.modal-due-input:focus { border-color: var(--accent); }
[data-theme="light"] .modal-due-input { color-scheme: light; }
.btn-clear-due {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: 1px solid var(--border-overlay);
  border-radius: 8px;
  color: var(--text-dim);
  font-size: 18px;
  cursor: pointer;
  transition: all var(--transition);
  flex-shrink: 0;
}
.btn-clear-due:hover { background: rgba(239,68,68,0.15); color: var(--danger); border-color: rgba(239,68,68,0.3); }

/* Card Due Date Badge */
.card-due {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  margin-top: 4px;
}
.card-due.due-overdue { background: rgba(239,68,68,0.15); color: #ef4444; }
.card-due.due-today { background: rgba(234,179,8,0.15); color: #eab308; }
.card-due.due-tomorrow { background: rgba(59,130,246,0.15); color: #3b82f6; }
.card-due.due-future { background: var(--hover-overlay); color: var(--text-dim); }

/* ===== Utilities ===== */
.no-select { user-select: none !important; -webkit-user-select: none !important; }
.hidden { display: none !important; }

/* ===== Stats View ===== */
#stats-view {
  padding: 24px 32px;
  overflow-y: auto;
  height: calc(100vh - 60px);
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.stats-header {
  margin-bottom: 4px;
}
.stats-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
}
.stats-cards {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}
.stat-card {
  flex: 1;
  min-width: 160px;
  padding: 22px 24px;
  background: var(--card-bg);
  backdrop-filter: blur(16px) saturate(150%);
  -webkit-backdrop-filter: blur(16px) saturate(150%);
  border: 1px solid var(--border-overlay);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
  transition: all var(--transition);
}
.stat-card:hover {
  background: var(--card-bg-hover);
  box-shadow: var(--shadow-card-hover);
  border-color: var(--border-overlay-strong);
  transform: translateY(-2px);
}
.stat-value {
  font-size: 36px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.stat-label {
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 6px;
  font-weight: 500;
}
.stats-charts {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}
.chart-box {
  flex: 1;
  min-width: 320px;
  padding: 20px 24px;
  background: var(--card-bg);
  backdrop-filter: blur(16px) saturate(150%);
  -webkit-backdrop-filter: blur(16px) saturate(150%);
  border: 1px solid var(--border-overlay);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.chart-box-wide {
  flex: 2;
  min-width: 500px;
}
.chart-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
  align-self: flex-start;
}
.chart-box canvas {
  max-width: 100%;
  height: auto;
}

/* ===== Calendar View ===== */
#calendar-view {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 60px);
  overflow-y: auto;
  padding: 16px 24px;
  gap: 12px;
}
.calendar-header {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  padding-bottom: 8px;
}
.cal-nav-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: var(--hover-overlay);
  border: 1px solid var(--border-overlay);
  border-radius: 10px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all var(--transition);
  flex-shrink: 0;
}
.cal-nav-btn:hover { background: var(--hover-overlay-strong); color: var(--text); border-color: var(--border-overlay-strong); }
.cal-month-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
  margin: 0;
  flex: 1;
  min-width: 160px;
}
.cal-today-btn {
  padding: 6px 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  flex-shrink: 0;
}
.cal-today-btn:hover { background: var(--accent-2); transform: translateY(-1px); }
.cal-view-toggle {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  background: var(--hover-overlay);
  border: 1px solid var(--border-overlay);
  border-radius: 10px;
  flex-shrink: 0;
}
.cal-toggle-btn {
  padding: 6px 14px;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.cal-toggle-btn:hover { color: var(--text); background: var(--hover-overlay-strong); }
.cal-toggle-btn.active { background: var(--accent); color: #fff; }
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-dim);
  padding: 4px 0 8px;
  flex-shrink: 0;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  flex: 1;
  align-content: start;
}
.cal-day {
  aspect-ratio: 1 / 1;
  min-height: 80px;
  padding: 6px;
  background: var(--card-bg);
  border: 1px solid var(--border-overlay);
  border-radius: 12px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
  position: relative;
}
.cal-day:hover { background: var(--card-bg-hover); border-color: var(--border-overlay-strong); box-shadow: var(--shadow-card-hover); }
.cal-day.other-month { opacity: 0.35; }
.cal-day.other-month:hover { opacity: 0.6; }
.cal-day.today { border-color: var(--accent); border-width: 2px; }
.cal-day-header {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
  flex-shrink: 0;
}
.cal-day.other-month .cal-day-header { color: var(--text-faint); }
.cal-day-chips {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-top: 4px;
  width: 100%;
  min-width: 0;
}
.cal-day-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  max-width: 100%;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--surface-tint);
  border: 1px solid var(--border-overlay);
  cursor: grab;
  user-select: none;
  transition: background 0.15s, border-color 0.15s;
}
.cal-day-chip:hover { background: var(--hover-overlay); border-color: var(--border-overlay-strong); }
.cal-day-chip-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.cal-day-chip-title {
  font-size: 10px;
  line-height: 1.3;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-day-chip-more {
  justify-content: center;
  cursor: pointer;
  font-size: 10px;
  color: var(--text-faint);
  font-weight: 600;
}
.cal-day-chip.dragging { visibility: hidden; }
.cal-day-dots {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: 2px;
}
.cal-day-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.cal-day-more {
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 600;
  line-height: 1;
  margin-top: 1px;
}

/* Calendar Day Popup */
.cal-day-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 900;
  width: 360px;
  max-width: 90vw;
  max-height: 70vh;
  background: var(--bg-elev);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--border-overlay-strong);
  border-radius: 18px;
  box-shadow: var(--shadow-modal);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cal-popup-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-overlay);
  flex-shrink: 0;
}
.cal-popup-header span {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.cal-popup-close {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 22px;
  cursor: pointer;
  border-radius: 8px;
  transition: all var(--transition);
}
.cal-popup-close:hover { background: var(--hover-overlay-strong); color: var(--text); }
.cal-popup-cards {
  padding: 12px 18px 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  flex: 1;
}
.cal-popup-card {
  padding: 10px 14px;
  background: var(--card-bg);
  border: 1px solid var(--border-overlay);
  border-radius: 10px;
  cursor: pointer;
  transition: all var(--transition);
}
.cal-popup-card:hover { background: var(--card-bg-hover); border-color: var(--border-overlay-strong); }
.cal-popup-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.cal-popup-card-list {
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 2px;
}

/* Week View */
.week-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
  overflow-y: auto;
}
.week-day {
  background: var(--card-bg);
  border: 1px solid var(--border-overlay);
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 60px;
}
.week-day.today { border-color: var(--accent); border-width: 2px; }
.week-day-header {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.week-day-date {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.week-day-label {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 500;
}
.week-day-count {
  font-size: 11px;
  color: var(--accent-2);
  background: var(--hover-overlay);
  padding: 2px 8px;
  border-radius: 10px;
  margin-left: auto;
  font-weight: 600;
}
.week-card {
  padding: 10px 14px;
  background: var(--surface-tint-light);
  border: 1px solid var(--border-overlay);
  border-radius: 10px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 10px;
}
.week-card:hover { background: var(--hover-overlay); border-color: var(--border-overlay-strong); }
.week-card-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.week-card-info {
  flex: 1;
  min-width: 0;
}
.week-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.week-card-list {
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 1px;
}

/* ===== AI Summary ===== */
.ai-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 16px;
}
.ai-header .chart-title {
  margin-bottom: 0;
}
.ai-settings-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: var(--hover-overlay);
  border: 1px solid var(--border-overlay);
  border-radius: 8px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all var(--transition);
  flex-shrink: 0;
}
.ai-settings-btn:hover {
  background: var(--hover-overlay-strong);
  color: var(--text);
  border-color: var(--border-overlay-strong);
}
.ai-summary {
  width: 100%;
  padding: 16px;
  background: var(--input-bg-light);
  border: 1px solid var(--border-overlay);
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text);
  min-height: 80px;
  max-height: 320px;
  overflow-y: auto;
  margin-bottom: 12px;
}
.ai-summary h4 {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-2);
  margin: 12px 0 6px;
}
.ai-summary h4:first-child { margin-top: 0; }
.ai-summary ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
.ai-summary li {
  padding: 4px 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ai-summary li::before {
  content: '•';
  color: var(--accent);
  font-weight: 700;
}
.ai-summary pre {
  white-space: pre-wrap;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 13px;
  line-height: 1.7;
  margin: 0;
}
.ai-placeholder {
  color: var(--text-faint);
  text-align: center;
  padding: 20px 0;
  font-size: 13px;
}
.ai-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.ai-generate-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  background: var(--accent-grad);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
  white-space: nowrap;
}
.ai-generate-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(59,130,246,0.3); }
.ai-generate-btn:active { transform: translateY(0); }
.ai-generate-btn.ai-weekly {
  background: rgba(59,130,246,0.15);
  border: 1px solid rgba(59,130,246,0.3);
  color: var(--accent-2);
}
.ai-generate-btn.ai-weekly:hover {
  background: rgba(59,130,246,0.25);
  box-shadow: 0 4px 16px rgba(59,130,246,0.15);
}
.ai-generate-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* ===== AI Settings Modal ===== */
.ai-settings-modal {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(8px) saturate(120%);
  -webkit-backdrop-filter: blur(8px) saturate(120%);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ai-settings-content {
  width: 420px;
  max-width: 90vw;
  padding: 24px;
  background: var(--bg-elev);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--border-overlay);
  border-radius: 20px;
  box-shadow: var(--shadow-modal);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.ai-settings-content h3 {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.ai-settings-content label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.ai-input {
  width: 100%;
  padding: 10px 14px;
  background: var(--input-bg);
  border: 1px solid var(--border-overlay);
  border-radius: 10px;
  color: var(--text);
  font-size: 13px;

<script>
/* ============================================================
   State & Persistence
   ============================================================ */
const STORAGE_KEY = 'kanban-board-v1';
const LABEL_COLORS = {
  red:    { bg: '#ef4444', text: '#fff', name: '红色' },
  orange: { bg: '#f97316', text: '#fff', name: '橙色' },
  yellow: { bg: '#eab308', text: '#1a1a2e', name: '黄色' },
  green:  { bg: '#22c55e', text: '#fff', name: '绿色' },
  cyan:   { bg: '#06b6d4', text: '#fff', name: '青色' },
  blue:   { bg: '#3b82f6', text: '#fff', name: '蓝色' },
  purple: { bg: '#a855f7', text: '#fff', name: '紫色' },
  pink:   { bg: '#ec4899', text: '#fff', name: '粉色' },
};

let state = {
  version: 2,
  boards: [],
  activeBoardId: null,
  boardTitle: '东青Trello看板',
  lists: [],  // active board alias (for legacy references)
  archive: [],
  bgImage: null,
  bgDim: false,
};

let uidCounter = 0;
function uid(prefix) { return `${prefix}-${Date.now()}-${++uidCounter}`; }

function migrateCard(card) {
  if (card.dueDate === undefined) card.dueDate = null;
  if (card.createdAt === undefined) card.createdAt = new Date().toISOString();
  if (card.completedAt === undefined) card.completedAt = null;
  if (!Array.isArray(card.labels)) card.labels = [];
  if (!Array.isArray(card.subtasks)) card.subtasks = [];
  if (!Array.isArray(card.attachments)) card.attachments = [];
}

function makeSampleLists() {
  return [
    {
      id: uid('list'), title: '待办',
      cards: [
        { id: uid('card'), title: '设计登录页面 UI 原型', description: '需要完成登录、注册、忘记密码三个页面的高保真设计稿，包含明暗主题适配。', labels: [{color:'purple',text:'设计'}], subtasks: [
          { id: uid('sub'), text: '绘制线框图', done: true },
          { id: uid('sub'), text: '完成高保真稿', done: false },
          { id: uid('sub'), text: '明暗主题适配', done: false },
        ], attachments: [] },
        { id: uid('card'), title: '编写 API 接口文档', description: '', labels: [{color:'blue',text:'文档'}], subtasks: [
          { id: uid('sub'), text: '用户认证接口', done: true },
          { id: uid('sub'), text: '数据 CRUD 接口', done: false },
        ], attachments: [] },
      ]
    },
    {
      id: uid('list'), title: '进行中',
      cards: [
        { id: uid('card'), title: '实现拖拽排序功能', description: '使用原生 Pointer Events 实现 FLIP 动画驱动的拖拽排序，支持跨列表移动。', labels: [{color:'green',text:'开发'},{color:'orange',text:'紧急'}], subtasks: [
          { id: uid('sub'), text: '卡片拖拽', done: true },
          { id: uid('sub'), text: '列表拖拽', done: true },
          { id: uid('sub'), text: '边缘自动滚动', done: false },
        ], attachments: [] },
        { id: uid('card'), title: '数据库性能优化', description: '针对慢查询进行索引优化', labels: [{color:'green',text:'开发'}], subtasks: [], attachments: [] },
      ]
    },
    {
      id: uid('list'), title: '已完成',
      cards: [
        { id: uid('card'), title: '项目环境搭建', description: '', labels: [{color:'cyan',text:'运维'}], subtasks: [
          { id: uid('sub'), text: '配置 CI/CD', done: true },
          { id: uid('sub'), text: '部署开发服务器', done: true },
        ], attachments: [] },
        { id: uid('card'), title: '需求评审会议', description: '与产品团队完成第一轮需求评审', labels: [{color:'red',text:'会议'}], subtasks: [], attachments: [] },
      ]
    },
  ];
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.lists) {
        // v1 format: single board of lists -> migrate to multi-board
        const board = {
          id: uid('board'),
          title: parsed.boardTitle || '东青Trello看板',
          createdAt: new Date().toISOString(),
          lists: parsed.lists,
        };
        state = {
          version: 2,
          boards: [board],
          activeBoardId: board.id,
          archive: Array.isArray(parsed.archive) ? parsed.archive : [],
          bgImage: parsed.bgImage || null,
          bgDim: parsed.bgDim === true,
          // preserve AI config from v1
          aiApiKey: parsed.aiApiKey || '',
          aiEndpoint: parsed.aiEndpoint || 'https://api.deepseek.com/chat/completions',
          aiModel: parsed.aiModel || 'deepseek-chat',
        };
        normalizeState();
        saveState();  // persist migrated v2 format immediately
        return;
      }
      if (parsed && Array.isArray(parsed.boards) && parsed.boards.length) {
        state = parsed;
        normalizeState();
        return;
      }
    }
  } catch(e) {}
  // Default sample data
  const board = { id: uid('board'), title: '东青Trello看板', createdAt: new Date().toISOString(), lists: makeSampleLists() };
  state = {
    version: 2,
    boards: [board],
    activeBoardId: board.id,
    archive: [],
    bgImage: null,
    bgDim: false,
    aiApiKey: '',
    aiEndpoint: 'https://api.deepseek.com/chat/completions',
    aiModel: 'deepseek-chat',
  };
}

/* Keep every field present and alias state.lists/state.boardTitle to the
   active board so all legacy list/card code keeps working unchanged. */
function normalizeState() {
  if (!Array.isArray(state.boards) || !state.boards.length) {
    state.boards = [{ id: uid('board'), title: state.boardTitle || '我的看板', createdAt: new Date().toISOString(), lists: [] }];
  }
  state.boards.forEach(b => {
    if (!Array.isArray(b.lists)) b.lists = [];
    b.lists.forEach(list => {
      if (!Array.isArray(list.cards)) list.cards = [];
      list.cards.forEach(migrateCard);
    });
  });
  if (!state.boards.find(b => b.id === state.activeBoardId)) {
    state.activeBoardId = state.boards[0].id;
  }
  if (!Array.isArray(state.archive)) state.archive = [];
  state.archive.forEach(a => { if (a.archivedAt === undefined) a.archivedAt = new Date().toISOString(); });
  syncActiveBoardAlias();
}

function getActiveBoard() {
  return state.boards.find(b => b.id === state.activeBoardId) || state.boards[0];
}

function syncActiveBoardAlias() {
  const board = getActiveBoard();
  state.lists = board.lists;
  state.boardTitle = board.title;
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; } catch(e) { return false; }
}

function switchBoard(boardId) {
  if (!state.boards.find(b => b.id === boardId)) return;
  state.activeBoardId = boardId;
  syncActiveBoardAlias();
  resetCalendarPosition();
  saveState();
  renderBoard();
  updateBoardSwitcherUI();
}

function createBoard(title) {
  const board = { id: uid('board'), title: title || '新建看板', createdAt: new Date().toISOString(), lists: makeSampleLists() };
  state.boards.push(board);
  switchBoard(board.id);
  return board;
}

function deleteBoard(boardId) {
  if (state.boards.length <= 1) { showToast('至少保留一个看板', 'error'); return; }
  const board = state.boards.find(b => b.id === boardId);
  if (!board) return;
  const idx = state.boards.indexOf(board);
  snapshotForUndo();
  state.boards.splice(idx, 1);
  if (state.activeBoardId === boardId) state.activeBoardId = state.boards[Math.max(0, idx - 1)].id;
  syncActiveBoardAlias();
  saveState();
  renderBoard();
  updateBoardSwitcherUI();
  showToast(`已删除看板「${board.title}」`, null, '撤销删除看板', () => { undoPop(); });
}

function updateBoardSwitcherUI() {
  const board = getActiveBoard();
  const nameEl = document.getElementById('board-switcher-name');
  const countEl = document.getElementById('board-switcher-count');
  if (nameEl) nameEl.textContent = board.title;
  if (countEl) countEl.textContent = board.lists.reduce((s, l) => s + l.cards.length, 0);
  boardTitleEl.textContent = board.title;
  document.title = board.title;
}

function openBoardSwitcher(x, y) {
  const menu = document.getElementById('board-switcher-menu');
  menu.innerHTML = '<div class="bsm-title">我的看板</div>';
  state.boards.forEach(b => {
    const cardCount = b.lists.reduce((s, l) => s + l.cards.length, 0);
    const item = document.createElement('div');
    item.className = 'bsm-item' + (b.id === state.activeBoardId ? ' active' : '');
    item.innerHTML = `
      <span class="bsm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></span>
      <span class="bsm-name">${escapeHtml(b.title)}</span>
      <span class="bsm-meta">${b.lists.length} 列表 · ${cardCount} 卡片</span>
      ${state.boards.length > 1 ? '<button class="bsm-action" title="删除看板">&times;</button>' : ''}
    `;
    if (state.boards.length > 1) {
      item.querySelector('.bsm-action').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteBoard(b.id);
        menu.classList.remove('active');
      });
    }
    item.addEventListener('click', () => {
      switchBoard(b.id);
      menu.classList.remove('active');
    });
    menu.appendChild(item);
  });
  const newBtn = document.createElement('button');
  newBtn.className = 'bsm-new';
  newBtn.textContent = '＋ 新建看板';
  newBtn.addEventListener('click', () => {
    menu.classList.remove('active');
    const name = prompt('新看板名称：', '新建看板');
    if (name === null) return;
    createBoard(name.trim() || '新建看板');
    showToast(`已创建看板「${name.trim() || '新建看板'}」`);
  });
  menu.appendChild(newBtn);
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.classList.add('active');
  // keep inside viewport
  const r = menu.getBoundingClientRect();
  if (r.right > window.innerWidth - 8) menu.style.left = Math.max(8, window.innerWidth - r.width - 8) + 'px';
  if (r.bottom > window.innerHeight - 8) menu.style.top = Math.max(8, window.innerHeight - r.height - 8) + 'px';
}

/* ============================================================
   Undo / Toast
   ============================================================ */
let undoStack = null;      // serialized state snapshot for one-shot undo
let undoTimer = null;

function snapshotForUndo() {
  try { undoStack = localStorage.getItem(STORAGE_KEY); } catch(e) { undoStack = null; }
  if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
}

function undoPop() {
  if (undoStack === null) return;
  const raw = undoStack;
  undoStack = null;
  // Close card modal if open: the modal holds a reference to a stale card object
  if (currentModalCard) {
    currentModalCard = null;
    modalOverlay.classList.remove('active');
    modalOverlay.style.display = 'none';
    document.removeEventListener('keydown', modalKeydownHandler);
    if (modalPasteHandler) { document.removeEventListener('paste', modalPasteHandler); modalPasteHandler = null; }
  }
  try {
    const parsed = JSON.parse(raw);
    if (parsed && (parsed.lists || Array.isArray(parsed.boards))) {
      state = parsed;
      normalizeState();
      saveState();
      renderBoard();
      updateBoardSwitcherUI();
      if (currentView === 'calendar') renderCalendarView();
      if (currentView === 'stats') renderStatsView();
      showToast('已撤销');
    }
  } catch(e) { showToast('撤销失败', 'error'); }
}

function showToast(msg, kind, actionLabel, actionFn, timeout) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast' + (kind === 'error' ? ' toast-error' : '');
  const msgSpan = document.createElement('span');
  msgSpan.className = 'toast-msg';
  msgSpan.textContent = msg;
  if (kind === 'error') msgSpan.style.color = 'var(--danger)';
  toast.appendChild(msgSpan);
  let done = false;
  const removeToast = () => {
    if (done) return;
    done = true;
    toast.classList.add('leaving');
    setTimeout(() => toast.remove(), 300);
  };
  if (actionLabel && actionFn) {
    const btn = document.createElement('button');
    btn.className = 'toast-undo';
    btn.textContent = actionLabel;
    btn.addEventListener('click', () => { actionFn(); btn.disabled = true; removeToast(); });
    toast.appendChild(btn);
  }
  container.appendChild(toast);
  setTimeout(removeToast, timeout || (actionLabel ? 6000 : 2600));
}

/* ============================================================
   Archive
   ============================================================ */
function archiveCard(card, list) {
  const listTitle = list ? list.title : '';
  snapshotForUndo();
  if (list) {
    const idx = list.cards.findIndex(c => c.id === card.id);
    if (idx !== -1) list.cards.splice(idx, 1);
  }
  state.archive.unshift({ type: 'card', card, listTitle, listId: list ? list.id : null, boardId: getActiveBoard().id, archivedAt: new Date().toISOString() });
  saveState();
  renderBoard();
  showToast('卡片已归档', null, '撤销', () => { undoPop(); });
}

function unarchiveItem(item) {
  snapshotForUndo();
  const idx = state.archive.indexOf(item);
  if (idx !== -1) state.archive.splice(idx, 1);
  if (item.type === 'card') {
    let board = state.boards.find(b => b.id === item.boardId) || getActiveBoard();
    let list = board.lists.find(l => l.id === item.listId);
    if (!list) {
      list = { id: uid('list'), title: item.listTitle || '已归档卡片', cards: [] };
      board.lists.push(list);
    }
    migrateCard(item.card);
    list.cards.push(item.card);
  }
  saveState();
  renderArchiveView();
  renderBoard();
  updateBoardSwitcherUI();
  showToast('已恢复');
}

function deleteArchivedItem(item) {
  const idx = state.archive.indexOf(item);
  if (idx !== -1) state.archive.splice(idx, 1);
  saveState();
  renderArchiveView();
}

function renderArchiveView() {
  const listEl = document.getElementById('archive-list');
  if (!state.archive.length) {
    listEl.innerHTML = '<div class="archive-empty">归档站是空的。右键卡片选择「归档卡片」，或删除卡片后在这里找回。</div>';
    return;
  }
  listEl.innerHTML = '';
  state.archive.forEach(item => {
    const el = document.createElement('div');
    el.className = 'archive-item';
    const when = formatDate(item.archivedAt);
    if (item.type === 'card') {
      el.innerHTML = `
        <div class="ai-main">
          <div class="ai-title">${escapeHtml(item.card.title)}</div>
          <div class="ai-meta">卡片 · 原列表「${escapeHtml(item.listTitle || '未知')}」 · 归档于 ${when}</div>
        </div>
        <div class="ai-actions">
          <button class="arc-restore">恢复</button>
          <button class="arc-delete">删除</button>
        </div>`;
    } else {
      const cardCount = (item.list.cards || []).length;
      el.innerHTML = `
        <div class="ai-main">
          <div class="ai-title">${escapeHtml(item.list.title)}</div>
          <div class="ai-meta">列表 · ${cardCount} 张卡片 · 归档于 ${when}</div>
        </div>
        <div class="ai-actions">
          <button class="arc-restore">恢复</button>
          <button class="arc-delete">删除</button>
        </div>`;
    }
    el.querySelector('.arc-restore').addEventListener('click', () => unarchiveItem(item));
    el.querySelector('.arc-delete').addEventListener('click', () => {
      snapshotForUndo();
      deleteArchivedItem(item);
      showToast('已从归档站删除', null, '撤销', () => { undoPop(); });
    });
    listEl.appendChild(el);
  });
}

/* ============================================================
   Search & Filter
   ============================================================ */
let searchQuery = '';
let filterLabels = new Set();
let filterDue = new Set();

function cardMatchesSearch(card) {
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    const hay = (card.title + ' ' + (card.description || '')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (filterLabels.size) {
    const cardLabels = (card.labels || []).map(l => l.color + ':' + (l.text || ''));
    const hit = cardLabels.some(key => filterLabels.has(key));
    if (!hit) return false;
  }
  if (filterDue.size) {
    const today = new Date(); today.setHours(0,0,0,0);
    if (!card.dueDate) return false;
    const due = new Date(card.dueDate + 'T00:00:00');
    const diffDays = Math.round((due - today) / 86400000);
    let bucket = 'later';
    if (diffDays < 0) bucket = 'overdue';
    else if (diffDays === 0) bucket = 'today';
    else if (diffDays <= 7) bucket = 'week';
    if (!filterDue.has(bucket)) return false;
  }
  return true;
}

function isFilterActive() {
  return !!(searchQuery || filterLabels.size || filterDue.size);
}

function applySearchStateUI() {
  const searchBar = document.getElementById('search-bar');
  const clearBtn = document.getElementById('search-clear');
  const filterBtn = document.getElementById('filter-btn');
  const active = isFilterActive();
  if (clearBtn) clearBtn.classList.toggle('visible', active);
  if (filterBtn) filterBtn.classList.toggle('active', !!(filterLabels.size || filterDue.size));
  boardEl.classList.toggle('board-filtered', active && currentView === 'board');
  renderBoard();
}

function getFilteredVisibleCount() {
  let total = 0, shown = 0;
  getActiveBoard().lists.forEach(l => l.cards.forEach(c => {
    total++;
    if (cardMatchesSearch(c)) shown++;
  }));
  return { total, shown };
}

function updateSearchCount() {
  const el = document.getElementById('search-count');
  if (!el) return;
  if (!isFilterActive()) { el.textContent = ''; return; }
  const { total, shown } = getFilteredVisibleCount();
  el.textContent = `${shown}/${total} 张卡片`;
}

function collectAllLabelKeys() {
  const map = new Map();
  getActiveBoard().lists.forEach(l => l.cards.forEach(c => {
    (c.labels || []).forEach(lb => {
      const key = lb.color + ':' + (lb.text || '');
      if (!map.has(key)) map.set(key, { color: lb.color, text: lb.text || '', count: 0 });
      map.get(key).count++;
    });
  }));
  return Array.from(map.values()).sort((a, b) => b.count - a.count);
}

function openFilterMenu(x, y) {
  const labels = collectAllLabelKeys();
  const rows = [];
  rows.push('<div class="fm-title">到期日</div><div class="fm-row">');
  const dueDefs = [
    ['overdue', '已过期'],
    ['today', '今天到期'],
    ['week', '7 天内'],
    ['later', '更晚'],
  ];
  dueDefs.forEach(([key, name]) => {
    rows.push(`<button class="fm-chip ${filterDue.has(key) ? 'active' : ''}" data-due="${key}">${name}</button>`);
  });
  rows.push('</div>');
  rows.push('<div class="fm-title">标签</div><div class="fm-row">');
  if (!labels.length) rows.push('<span style="font-size:12px;color:var(--text-faint);padding:4px 2px;">当前看板暂无标签</span>');
  labels.forEach(lb => {
    const key = lb.color + ':' + lb.text;
    const c = LABEL_COLORS[lb.color] || LABEL_COLORS.blue;
    rows.push(`<button class="fm-chip fm-label-dot ${filterLabels.has(key) ? 'active' : ''}" data-label="${escapeHtml(key)}" style="--dot:${c.bg}">${escapeHtml(lb.text || c.name)} (${lb.count})</button>`);
  });
  rows.push('</div>');
  rows.push('<div class="fm-row" style="padding-top:0"><button class="fm-chip" data-clear="1">清除全部筛选</button></div>');
  showContextMenu(x, y, [], rows.join(''));
  document.querySelectorAll('#context-menu .fm-chip').forEach(chip => {
    chip.addEventListener('click', (e) => {
      e.stopPropagation();
      if (chip.dataset.due) {
        const k = chip.dataset.due;
        filterDue.has(k) ? filterDue.delete(k) : filterDue.add(k);
        chip.classList.toggle('active');
      } else if (chip.dataset.label) {
        const k = chip.dataset.label;
        filterLabels.has(k) ? filterLabels.delete(k) : filterLabels.add(k);
        chip.classList.toggle('active');
      } else if (chip.dataset.clear) {
        filterDue.clear(); filterLabels.clear();
        document.querySelectorAll('#context-menu .fm-chip.active').forEach(el => el.classList.remove('active'));
      }
      document.getElementById('filter-btn').classList.toggle('active', !!(filterLabels.size || filterDue.size));
      contextMenu.classList.add('active');
      applySearchStateUI();
      updateSearchCount();
    });
  });
}

/* ============================================================
   Markdown (safe subset renderer)
   ============================================================ */
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function mdInline(text) {
  let s = escapeHtml(text);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, '<img src="$2" alt="$1">');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return s;
}

function renderMarkdown(md) {
  const lines = String(md || '').replace(/\r\n/g, '\n').split('\n');
  let html = '', para = [], listStack = null, inCode = false, codeLines = [];

  const flushPara = () => {
    if (para.length) { html += '<p>' + mdInline(para.join('<br>')) + '</p>'; para = []; }
  };
  const closeList = () => {
    if (listStack) { html += listStack === 'ul' ? '</ul>' : '</ol>'; listStack = null; }
  };

  for (const raw of lines) {
    if (/^```/.test(raw.trim())) {
      if (inCode) { html += '<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>'; codeLines = []; inCode = false; }
      else { flushPara(); closeList(); inCode = true; }
      continue;
    }
    if (inCode) { codeLines.push(raw); continue; }

    const t = raw.trim();
    if (!t) { flushPara(); closeList(); continue; }

    let m;
    if ((m = t.match(/^(#{1,4})\s+(.*)$/))) {
      flushPara(); closeList();
      const level = m[1].length;
      html += `<h${level}>` + mdInline(m[2]) + `</h${level}>`;
      continue;
    }
    if (/^(---+|\*\*\*+)$/.test(t)) { flushPara(); closeList(); html += '<hr>'; continue; }
    if ((m = t.match(/^>\s?(.*)$/))) {
      flushPara(); closeList();
      html += '<blockquote><p>' + mdInline(m[1]) + '</p></blockquote>';
      continue;
    }
    if ((m = t.match(/^[-*+]\s+(.*)$/))) {
      flushPara();
      if (listStack !== 'ul') { closeList(); html += '<ul>'; listStack = 'ul'; }
      html += '<li>' + mdInline(m[1]) + '</li>';
      continue;
    }
    if ((m = t.match(/^\d+[.)]\s+(.*)$/))) {
      flushPara();
      if (listStack !== 'ol') { closeList(); html += '<ol>'; listStack = 'ol'; }
      html += '<li>' + mdInline(m[1]) + '</li>';
      continue;
    }
    closeList();
    para.push(t);
  }
  if (inCode && codeLines.length) html += '<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>';
  flushPara(); closeList();
  return html || '<p class="md-empty">暂无描述</p>';
}

/* ============================================================
   Attachments
   ============================================================ */
function formatBytes(n) {
  if (!n && n !== 0) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function addAttachmentFromDataUrl(card, dataUrl, name) {
  const bytes = Math.floor(dataUrl.length * 0.75);
  if (bytes > 3 * 1024 * 1024) {
    showToast('图片过大（超过 3MB），未添加', 'error');
    return false;
  }
  card.attachments = card.attachments || [];
  card.attachments.push({ id: uid('att'), name: name || '截图.png', data: dataUrl, size: bytes, createdAt: new Date().toISOString() });
  saveState();
  return true;
}

function renderModalAttachments(card) {
  const listEl = document.getElementById('attach-list');
  listEl.innerHTML = '';
  if (!card.attachments || !card.attachments.length) {
    listEl.innerHTML = '<div class="attach-empty">暂无附件，添加或粘贴图片后显示在这里</div>';
    return;
  }
  card.attachments.forEach(att => {
    const item = document.createElement('div');
    item.className = 'attach-item';
    const img = document.createElement('img');
    img.className = 'attach-thumb';
    img.src = att.data;
    img.alt = att.name;
    img.title = '点击放大预览';
    img.addEventListener('click', () => openLightbox(att.data));
    const name = document.createElement('span');
    name.className = 'attach-name';
    name.textContent = att.name;
    const size = document.createElement('span');
    size.className = 'attach-size';
    size.textContent = formatBytes(att.size);
    const del = document.createElement('button');
    del.className = 'attach-delete';
    del.title = '删除附件';
    del.textContent = '×';
    del.addEventListener('click', () => {
      snapshotForUndo();
      card.attachments = card.attachments.filter(a => a.id !== att.id);
      saveState();
      renderModalAttachments(card);
      showToast('附件已删除', null, '撤销', () => { undoPop(); renderModalAttachments(card); });
    });
    item.appendChild(img);
    item.appendChild(name);
    item.appendChild(size);
    item.appendChild(del);
    listEl.appendChild(item);
  });
}

function openLightbox(dataUrl) {
  const lb = document.getElementById('lightbox');
  lb.querySelector('img').src = dataUrl;
  lb.classList.add('active');
}

function openAttachFilePicker(card) {
  const input = document.getElementById('attach-file-input');
  input.value = '';
  input.onchange = () => {
    const files = Array.from(input.files || []);
    let added = 0;
    let pending = files.length;
    if (!pending) return;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        if (addAttachmentFromDataUrl(card, reader.result, file.name)) added++;
        pending--;
        if (!pending) {
          renderModalAttachments(card);
          if (added) showToast(`已添加 ${added} 个附件`);
        }
      };
      reader.readAsDataURL(file);
    });
  };
  input.click();
}

/* ============================================================
   Export / Import / Background
   ============================================================ */
function exportData() {
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    a.href = url;
    a.download = `看板备份-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('备份文件已导出');
  } catch (e) {
    showToast('导出失败：' + e.message, 'error');
  }
}

function openImportPicker() {
  const input = document.getElementById('import-file-input');
  input.value = '';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const ok = (parsed && (Array.isArray(parsed.boards) || Array.isArray(parsed.lists)));
        if (!ok) throw new Error('文件格式不正确');
        snapshotForUndo();
        state = parsed;
        normalizeState();
        saveState();
        resetCalendarPosition();
        renderBoard();
        updateBoardSwitcherUI();
        applyCustomBackground();
        if (currentView === 'calendar') renderCalendarView();
        if (currentView === 'stats') renderStatsView();
        showToast('导入成功', null, '撤销导入', () => { undoPop(); });
      } catch (e) {
        showToast('导入失败：' + e.message, 'error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function applyCustomBackground() {
  document.body.classList.toggle('custom-bg', !!state.bgImage);
  document.body.classList.toggle('custom-bg-dim', !!state.bgImage && state.bgDim === true);
  if (state.bgImage) {
    document.body.style.setProperty('--custom-bg-image', `url("${state.bgImage}")`);
  } else {
    document.body.style.removeProperty('--custom-bg-image');
  }
}

/* Downscale + re-encode an image data URL so that the stored value fits in
   localStorage (which caps at ~5MB per origin). Returns a Promise<string>. */
function compressImageDataURL(dataUrl, maxDim, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      } catch (e) {
        resolve(dataUrl);
      }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

function openBgPicker() {
  const input = document.getElementById('bg-file-input');
  input.value = '';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type || '')) { showToast('请选择图片文件', 'error'); return; }
    if (file.size > 25 * 1024 * 1024) { showToast('背景图片过大（超过 25MB）', 'error'); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      const raw = reader.result;
      snapshotForUndo();
      const prev = state.bgImage;
      // Try the original first when it is small enough (keeps PNG transparency),
      // then progressively downscale/compress until the state fits in storage.
      const attempts = file.size <= 900 * 1024
        ? [{ passthrough: true }, { maxDim: 2560, q: 0.86 }, { maxDim: 1920, q: 0.8 }, { maxDim: 1440, q: 0.72 }, { maxDim: 1080, q: 0.65 }]
        : [{ maxDim: 2560, q: 0.86 }, { maxDim: 1920, q: 0.8 }, { maxDim: 1440, q: 0.72 }, { maxDim: 1080, q: 0.65 }];
      let saved = false;
      for (const a of attempts) {
        const candidate = a.passthrough ? raw : await compressImageDataURL(raw, a.maxDim, a.q);
        if (typeof candidate !== 'string' || candidate.length < 32) continue;
        state.bgImage = candidate;
        if (saveState()) { saved = true; break; }
      }
      if (!saved) {
        state.bgImage = prev;
        saveState();
        applyCustomBackground();
        showToast('背景图片过大，无法保存，请换一张更小的图片', 'error');
        return;
      }
      applyCustomBackground();
      showToast('背景已更新', null, '撤销', () => { undoPop(); applyCustomBackground(); });
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function paletteRenderList(q) {
  const listEl = document.getElementById('palette-list');
  paletteItems = [];
  if (q.startsWith('>')) {
    const qs = q.slice(1).trim().toLowerCase();
    paletteItems = collectPaletteCommands()
      .filter(c => !qs || c.title.toLowerCase().includes(qs) || c.sub.includes(qs))
      .map(c => ({ kind: 'cmd', ...c }));
  } else {
    const qs = q.trim().toLowerCase();
    getActiveBoard().lists.forEach(list => {
      list.cards.forEach(card => {
        const hay = (card.title + ' ' + (card.description || '')).toLowerCase();
        if (!qs || hay.includes(qs)) {
          paletteItems.push({ kind: 'card', icon: '🗂', title: card.title, sub: '列表「' + list.title + '」', run: () => openCardById(card.id) });
        }
      });
    });
    if (!qs) {
      collectPaletteCommands().forEach(c => paletteItems.push({ kind: 'cmd', ...c }));
    }
  }
  paletteSelected = Math.min(paletteSelected, Math.max(0, paletteItems.length - 1));
  if (!paletteItems.length) {
    listEl.innerHTML = '<div class="palette-empty">没有匹配的结果</div>';
    return;
  }
  listEl.innerHTML = paletteItems.map((it, i) => `
    <div class="palette-item ${i === paletteSelected ? 'selected' : ''}" data-index="${i}">
      <div class="pi-icon">${it.icon}</div>
      <div class="pi-text">
        <div class="pi-title">${escapeHtml(it.title)}</div>
        <div class="pi-sub">${escapeHtml(it.sub || '')}</div>
      </div>
    </div>`).join('');
  listEl.querySelectorAll('.palette-item').forEach(el => {
    el.addEventListener('click', () => {
      closePalette();
      paletteItems[Number(el.dataset.index)].run();
    });
    el.addEventListener('mousemove', () => {
      const idx = Number(el.dataset.index);
      if (idx !== paletteSelected) {
        paletteSelected = idx;
        listEl.querySelectorAll('.palette-item').forEach((n, i) => n.classList.toggle('selected', i === idx));
      }
    });
  });
  const sel = listEl.querySelector('.palette-item.selected');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

function openPalette() {
  const overlay = document.getElementById('palette-overlay');
  const input = document.getElementById('palette-input');
  overlay.classList.add('active');
  input.value = '';
  paletteSelected = 0;
  paletteRenderList('');
  setTimeout(() => input.focus(), 30);
}

function closePalette() {
  document.getElementById('palette-overlay').classList.remove('active');
}

function paletteKeydown(e) {
  if (e.key === 'Escape') { e.preventDefault(); closePalette(); return; }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    paletteSelected = Math.min(paletteSelected + 1, paletteItems.length - 1);
    paletteRenderList(document.getElementById('palette-input').value);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    paletteSelected = Math.max(paletteSelected - 1, 0);
    paletteRenderList(document.getElementById('palette-input').value);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const item = paletteItems[paletteSelected];
    if (item) { closePalette(); item.run(); }
  }
}

/* ============================================================
   Global Keyboard Shortcuts
   ============================================================ */
function isEditableTarget(t) {
  return !!(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable || t.tagName === 'SELECT'));
}

function handleGlobalKeydown(e) {
  const mod = e.metaKey || e.ctrlKey;
  const target = e.target;

  // Escape: close overlays in priority order
  if (e.key === 'Escape') {
    if (document.getElementById('palette-overlay').classList.contains('active')) { closePalette(); return; }
    if (document.getElementById('lightbox').classList.contains('active')) { document.getElementById('lightbox').classList.remove('active'); return; }
    if (document.getElementById('archive-modal').classList.contains('active')) { closeArchiveModal(); return; }
    if (document.getElementById('shortcuts-modal').classList.contains('active')) { closeShortcutsModal(); return; }
    // AI settings modal handles itself; modal handled by modalKeydownHandler
  }

  if (e.key === '?' && !isEditableTarget(target) && !mod) {
    e.preventDefault();
    openShortcutsModal();
    return;
  }

  if (!mod) return;
  const k = e.key.toLowerCase();

  if (k === 'k') { e.preventDefault(); openPalette(); return; }
  if (k === 'f') { e.preventDefault(); switchView('board'); const inp = document.getElementById('search-input'); inp.focus(); inp.select(); return; }
  if (k === '1') { e.preventDefault(); switchView('board'); return; }
  if (k === '2') { e.preventDefault(); switchView('calendar'); return; }
  if (k === '3') { e.preventDefault(); switchView('stats'); return; }
  if (k === 'j') { e.preventDefault(); toggleTheme(); return; }
  if (k === 'l') { e.preventDefault(); const r = document.getElementById('tool-btn').getBoundingClientRect(); openToolMenu(r.left, r.bottom + 6); return; }
  if (k === 'n' && !isEditableTarget(target)) { e.preventDefault(); const ph = boardEl.querySelector('.add-list-placeholder'); if (ph) ph.click(); return; }
  if (k === 'z' && undoStack !== null && !isEditableTarget(target)) { e.preventDefault(); undoPop(); return; }
  if (k === 'enter' && undoStack !== null && !isEditableTarget(target)) { e.preventDefault(); undoPop(); return; }

  // Markdown preview toggle inside card modal
  if (k === 'm' && currentModalCard && !isEditableTarget(target)) {
    e.preventDefault();
    toggleMarkdownPreview();
  }
}

function renderCard(card, listId, cardIndex) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.cardId = card.id;
  el.dataset.listId = listId;

  let labelsHtml = '';
  if (card.labels && card.labels.length) {
    labelsHtml = '<div class="card-labels">' + card.labels.map(l => {
      const c = LABEL_COLORS[l.color] || LABEL_COLORS.blue;
      return `<span class="card-label" style="background:${c.bg};color:${c.text}">${escapeHtml(l.text||'')}</span>`;
    }).join('') + '</div>';
  }

  let badgesHtml = '';
  if (card.subtasks && card.subtasks.length) {
    const done = card.subtasks.filter(s => s.done).length;
    badgesHtml = `<div class="card-badges">
      <span class="card-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>${done}/${card.subtasks.length}</span>
      ${(card.attachments && card.attachments.length) ? `<span class="card-badge" title="${card.attachments.length} 个附件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>${card.attachments.length}</span>` : ''}
    </div>`;
  }

  let dueDateHtml = '';
  if (card.dueDate) {
    const due = new Date(card.dueDate);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const dueDay = new Date(due.getFullYear(), due.getMonth(), due.getDate());
    const diffDays = Math.ceil((dueDay - today) / (1000 * 60 * 60 * 24));
    let dueClass = 'due-future';
    let dueText = formatDate(card.dueDate);
    if (diffDays < 0) { dueClass = 'due-overdue'; dueText = '已过期'; }
    else if (diffDays === 0) { dueClass = 'due-today'; dueText = '今天到期'; }
    else if (diffDays === 1) { dueClass = 'due-tomorrow'; dueText = '明天到期'; }
    dueDateHtml = `<span class="card-due ${dueClass}">${dueText}</span>`;
  }

  el.innerHTML = `${labelsHtml}<div class="card-title">${escapeHtml(card.title)}</div>${dueDateHtml}${badgesHtml}`;
  attachCardEvents(el, card, listId);
  return el;
}

/* Cross-environment compatible animation frame helpers */
function nextFrame(fn) {
  setTimeout(fn, 16);
}
function animFrame(fn) {
  return setTimeout(fn, 16);

  clearTimeout(id);

/* ============================================================
   FLIP Animation Helper
   ============================================================ */
function flipElements(elements, duration) {
  const d = duration || 320;
  // FIRST: record positions
  const firstRects = new Map();
  elements.forEach(el => {
    if (el && el.isConnected) firstRects.set(el, el.getBoundingClientRect());
  });
  // Return controller — caller does DOM change, then calls play()
  return {
    play() {
      // INVERT + PLAY
      firstRects.forEach((firstRect, el) => {
        if (!el.isConnected) return;
        const lastRect = el.getBoundingClientRect();
        const dx = firstRect.left - lastRect.left;
        const dy = firstRect.top - lastRect.top;
        if (dx !== 0 || dy !== 0) {
          el.style.transition = 'none';
          el.style.transform = `translate(${dx}px, ${dy}px)`;
          // Force reflow
          el.offsetHeight;
          nextFrame(() => {
            el.style.transition = `transform ${d}ms cubic-bezier(0.2,0,0,1)`;
            el.style.transform = '';
            const cleanup = () => {
              el.style.transition = '';
              el.style.transform = '';
              el.removeEventListener('transitionend', cleanup);
            };
            el.addEventListener('transitionend', cleanup);
          });
        }
      });
    }
  };
}
