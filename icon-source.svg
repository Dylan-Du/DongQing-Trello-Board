<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ============================================================
       东青 Trello 看板 · Logo v3
       设计语言：青（cyan）→ 蓝（blue）渐变，方正圆角（squircle），
       三列看板 + 悬浮卡片，强调小尺寸下的识别度。
       ============================================================ -->
  <defs>
    <!-- 背景：深靛蓝渐变（呼应应用主背景色 bg / bg-elev） -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="45%" y2="100%">
      <stop offset="0%" stop-color="#0A1830"/>
      <stop offset="55%" stop-color="#0C2244"/>
      <stop offset="100%" stop-color="#10305A"/>
    </linearGradient>

    <!-- 环境光 -->
    <radialGradient id="glowTop" cx="22%" cy="12%" r="72%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="88%" cy="92%" r="62%">
      <stop offset="0%" stop-color="#4F7DF3" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#4F7DF3" stop-opacity="0"/>
    </radialGradient>

    <!-- 品牌主渐变：青 → 天蓝 → 蓝 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2BE0D6"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4F7DF3"/>
    </linearGradient>

    <!-- 普通列：暗色玻璃 -->
    <linearGradient id="columnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3C63"/>
      <stop offset="100%" stop-color="#142C4C"/>
    </linearGradient>

    <!-- 高亮列：主渐变（略降饱和，避免过曝） -->
    <linearGradient id="columnAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D3E8"/>
      <stop offset="100%" stop-color="#4A7CEA"/>
    </linearGradient>

    <linearGradient id="cardWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#E4F2FF" stop-opacity="0.86"/>
    </linearGradient>

    <!-- 圆角矩形裁剪 -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232"/>
    </clipPath>

    <!-- 悬浮卡片阴影 -->
    <filter id="liftShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020A18" flood-opacity="0.55"/>
    </filter>
    <filter id="colShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020A18" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- 背景 -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#glowTop)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#glowBottom)"/>

    <!-- 内描边高光 -->
    <rect x="26" y="26" width="972" height="972" rx="210" ry="210"
          fill="none" stroke="#7FD8FF" stroke-opacity="0.10" stroke-width="2"/>

    <!-- ================= 左列（普通） ================= -->
    <g transform="translate(166, 252)">
      <rect width="200" height="520" rx="44" fill="url(#columnGrad)"
            stroke="#7FB6FF" stroke-opacity="0.10" stroke-width="1.5"/>
      <circle cx="52" cy="56" r="15" fill="#38BDF8" fill-opacity="0.55"/>
      <rect x="28" y="100" width="144" height="96" rx="22" fill="#FFFFFF" fill-opacity="0.11"/>
      <rect x="28" y="216" width="144" height="64" rx="22" fill="#FFFFFF" fill-opacity="0.09"/>
      <rect x="28" y="300" width="144" height="88" rx="22" fill="#FFFFFF" fill-opacity="0.11"/>
      <rect x="28" y="408" width="144" height="64" rx="22" fill="#FFFFFF" fill-opacity="0.07"/>
    </g>

    <!-- ================= 右列（普通） ================= -->
    <g transform="translate(658, 252)">
      <rect width="200" height="520" rx="44" fill="url(#columnGrad)"
            stroke="#7FB6FF" stroke-opacity="0.10" stroke-width="1.5"/>
      <circle cx="52" cy="56" r="15" fill="#38BDF8" fill-opacity="0.4"/>
      <rect x="28" y="100" width="144" height="60" rx="22" fill="#FFFFFF" fill-opacity="0.09"/>
      <rect x="28" y="180" width="144" height="92" rx="22" fill="#FFFFFF" fill-opacity="0.11"/>
      <rect x="28" y="292" width="144" height="72" rx="22" fill="#FFFFFF" fill-opacity="0.09"/>
      <rect x="28" y="384" width="144" height="56" rx="22" fill="#FFFFFF" fill-opacity="0.07"/>
    </g>

    <!-- ================= 中列（高亮） ================= -->
    <g filter="url(#colShadow)">
      <rect x="412" y="252" width="200" height="520" rx="44" fill="url(#columnAccent)"/>
    </g>
    <g transform="translate(412, 252)">
      <rect width="200" height="520" rx="44" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
      <circle cx="52" cy="56" r="15" fill="#FFFFFF" fill-opacity="0.95"/>
      <rect x="28" y="100" width="144" height="96" rx="22" fill="url(#cardWhite)"/>
      <rect x="28" y="216" width="144" height="64" rx="22" fill="url(#cardWhite)" fill-opacity="0.85"/>
      <rect x="28" y="300" width="144" height="88" rx="22" fill="url(#cardWhite)" fill-opacity="0.7"/>
      <rect x="28" y="408" width="144" height="64" rx="22" fill="url(#cardWhite)" fill-opacity="0.55"/>
    </g>

    <!-- ================= 悬浮卡片（拖拽中） ================= -->
    <g transform="rotate(-7 512 208)" filter="url(#liftShadow)">
      <rect x="386" y="148" width="252" height="120" rx="30" fill="url(#cardWhite)"/>
      <rect x="414" y="182" width="72" height="10" rx="5" fill="url(#accentGrad)"/>
      <rect x="414" y="208" width="180" height="9" rx="4.5" fill="#173354" fill-opacity="0.30"/>
      <rect x="414" y="228" width="120" height="9" rx="4.5" fill="#173354" fill-opacity="0.18"/>
    </g>
  </g>
</svg>
